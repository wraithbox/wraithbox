// The contract between wb-hostd and wb-vmd, the VM provider
// (S04-02-vm-provider). wb-hostd is the client and wb-vmd serves it,
// over a local IPC endpoint only the user can open (S04-architecture,
// "Inter-process contracts").
//
// The contract never names a path, a slot or a device type. wb-vmd's
// device set is fixed in its code and checked before every start
// (S04-02-vm-provider, "The device set is fixed and checked").
//
// Refusals use gRPC's rich error model: status FAILED_PRECONDITION or
// INVALID_ARGUMENT, with a google.rpc.ErrorInfo detail whose `reason` is
// the name of the rule that refused. The caller reads the rule as data
// and never parses the message text (S04-02-vm-provider).
//
// A change an older peer can't read goes in a new major package next to
// this one, never in an edit of it (S04-08-records-and-bounds, "`.proto`
// packages").
syntax = "proto3";

package wraithbox.vmd.v1;

// VMService runs one VM: there is one wb-vmd per VM
// (S04-04-vm-processes, "One `wb-vmd` per VM").
service VMService {
  // Start boots the VM. wb-vmd checks its own description of the
  // configuration against the fixed device set first, and refuses with
  // the rule when it doesn't match. It refuses with `vm-network-failed`
  // when it can't make or set up the packet transport's socketpair
  // (S06-06-devices-and-warm-start, "Network device per slot").
  rpc Start(StartRequest) returns (StartResponse);

  // Stop stops the VM in the way `mode` names.
  rpc Stop(StopRequest) returns (StopResponse);

  // GetState returns the VM's current state.
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  // WatchState sends the current state, then each change. wb-hostd
  // learns from it that a VM stopped on its own
  // (S06-11-reconnect-and-recovery, "Lost").
  rpc WatchState(WatchStateRequest) returns (stream WatchStateResponse);

  // ConnectGuest opens a host-guest socket connection to `guest_port` in
  // the guest. gRPC can't pass a descriptor, so the answer holds none:
  // wb-vmd sends the connection's descriptor on the hand-off channel in a
  // HandoffMessage with the same `request_id` (S04-02-vm-provider, "Hand-off
  // on macOS").
  rpc ConnectGuest(ConnectGuestRequest) returns (ConnectGuestResponse);

  // Install installs macOS into the build bundle from the restore image
  // at its fixed path, and streams the progress (S04-10-vmd-install,
  // "`wb-vmd-install`"). The request names no path and no image. Only
  // the build slot serves it. Every other slot refuses it with
  // `vmd-install-refused` before it touches a file, and the build slot
  // refuses a second install, an install while its VM runs, and a bundle
  // that already holds an installed file the same way. An image this
  // host can't run is refused with `vmd-restore-image-unsupported`, and
  // a framework failure with `vm-install-failed`.
  rpc Install(InstallRequest) returns (stream InstallResponse);
}

message StartRequest {
  // The VM generation, chosen by wb-hostd, which owns generations. Each
  // start and each restore begins a new one (S04-02-vm-provider,
  // "Restore"). Generations start at 1, and wb-vmd refuses 0.
  uint64 generation = 1;
  // Number of virtual CPUs (S06-06-devices-and-warm-start, "Resources").
  uint32 cpu_count = 2;
  // Guest memory in MiB (S06-06-devices-and-warm-start, "Resources").
  uint64 memory_mib = 3;
  // The MAC address of the VM's one network device, six bytes. wb-hostd
  // makes it once per slot and keeps it, so it is the same in every
  // generation (S06-06-devices-and-warm-start, "MAC address").
  // wb-vmd refuses any other length, and an address that isn't a
  // locally administered unicast one, with the rule `vmd-mac-invalid`.
  bytes mac_address = 4;
  // Asks for a start with the macOS provisioning options, which create
  // the guest's admin user with the build password (S15-04-guest-admin,
  // "Build"). wb-vmd reads the password from its descriptor 5, never
  // from a request (S04-11-vmd-start, "How `wb-vmd` is started").
  // Every slot refuses it with `vmd-provisioning-refused` until the
  // provisioning check is in the start path (#629). Only the build slot
  // will accept it.
  bool provisioning = 5;
}

message StartResponse {}

// StopMode says how Stop stops the VM. The caller decides how long to
// wait for a requested stop before it asks for a forced one.
enum StopMode {
  // Refused: a stop names its mode.
  STOP_MODE_UNSPECIFIED = 0;
  // Ask the guest to shut down, and return without waiting for it.
  STOP_MODE_REQUEST = 1;
  // Stop the VM at once.
  STOP_MODE_FORCE = 2;
}

message StopRequest {
  // The generation the caller means. wb-vmd refuses 0, and a stop for
  // any generation but the current one.
  uint64 generation = 1;
  StopMode mode = 2;
}

message StopResponse {}

message GetStateRequest {}

message GetStateResponse {
  VMState state = 1;
}

message WatchStateRequest {}

message WatchStateResponse {
  VMState state = 1;
}

// State mirrors the states of the Virtualization framework's
// VZVirtualMachine.State.
enum State {
  STATE_UNSPECIFIED = 0;
  STATE_STOPPED = 1;
  STATE_STARTING = 2;
  STATE_RUNNING = 3;
  STATE_PAUSED = 4;
  STATE_ERROR = 5;
  STATE_PAUSING = 6;
  STATE_RESUMING = 7;
  STATE_STOPPING = 8;
  STATE_SAVING = 9;
  STATE_RESTORING = 10;
}

message VMState {
  // The generation this state belongs to, 0 before the first start.
  uint64 generation = 1;
  State state = 2;
  // Set when the VM failed: the error that stopped it or made a start or
  // restore fail.
  VMError error = 3;
}

// VMError carries the four parts of a framework error that
// S06-06-devices-and-warm-start ("Deciding permanence") asks wb-vmd to
// pass on. wb-hostd logs them with its classification.
message VMError {
  // The error code, a VZError.Code value.
  int64 code = 1;
  // The error's localized failure reason, empty when it has none.
  string failure_reason = 2;
  // The errno of the underlying POSIX error, 0 when there is none.
  int32 errno = 3;
  // The error's localized description.
  string description = 4;
}

message ConnectGuestRequest {
  // The generation the caller means. wb-vmd refuses 0 and any but the
  // current one.
  uint64 generation = 1;
  // Chosen by the caller, unique among its open requests, and at least 1:
  // wb-vmd refuses 0. The HandoffMessage that carries the connection
  // repeats it.
  uint64 request_id = 2;
  // The guest port to connect to. Every guest port wb-hostd connects to
  // is below 1024 (S04-02-vm-provider, "Guest ports below 1024").
  uint32 guest_port = 3;
}

message ConnectGuestResponse {}

message InstallRequest {
  // Number of virtual CPUs of the install's VM, as in StartRequest.
  uint32 cpu_count = 1;
  // Memory of the install's VM in MiB, as in StartRequest.
  uint64 memory_mib = 2;
}

// InstallResponse is one message of the install's progress stream.
// wb-vmd sends at most one per whole percent, in rising order, and 100
// once the install has finished.
message InstallResponse {
  // The whole percent done, 0 to 100.
  uint32 percent = 1;
  // Set only in the last message of a failed install: the framework's
  // error. The call then ends with the rule `vm-install-failed`.
  VMError error = 2;
}

// Direction says which side opened a handed-off connection.
enum Direction {
  // Refused.
  DIRECTION_UNSPECIFIED = 0;
  // The host opened it. The host opens every host-guest connection
  // (S04-02-vm-provider, "The host opens every connection").
  DIRECTION_HOST_TO_GUEST = 1;
}

// Kind says what a HandoffMessage's descriptor is.
enum Kind {
  // Refused.
  KIND_UNSPECIFIED = 0;
  // A host-guest connection that answers a ConnectGuest request: a
  // stream socket.
  KIND_CONNECTION = 1;
  // The host end of the VM's packet transport: an AF_UNIX SOCK_DGRAM
  // socket whose other end is the VM's file-handle network attachment
  // (S07-02-packet-path, "Packet transport"). wb-vmd sends one per
  // generation, before it starts the VM.
  KIND_NETWORK = 2;
}

// HandoffMessage is not part of any RPC. wb-vmd sends one for each
// descriptor it hands to wb-hostd, as one record on the hand-off
// channel: an AF_UNIX SOCK_DGRAM socketpair with no path that wb-hostd
// passes to wb-vmd at spawn (S04-02-vm-provider, "Hand-off on macOS").
// The record is this message's protobuf encoding, with exactly one
// descriptor attached by SCM_RIGHTS: a connection (KIND_CONNECTION) or
// the packet transport (KIND_NETWORK). The channel carries records both
// ways: wb-hostd answers each HandoffMessage it decodes with a
// HandoffAck, and wb-vmd keeps its copy of the descriptor until then.
//
// The receiver refuses the record, closes every descriptor that came
// with it, and logs the refusal with its rule. internal/platform/fdchan
// refuses, before the record is decoded:
//
// - a record over 256 bytes (`fdchan-record-size`), or one whose control
//   data arrived truncated (`fdchan-control-truncated`);
// - a record with two or more descriptors (`fdchan-fd-count`).
//
// The receiver then refuses:
//
// - a record that doesn't decode as a HandoffMessage, or that holds a
//   field this message doesn't have (`handoff-malformed`);
// - a `kind` that is neither KIND_CONNECTION nor KIND_NETWORK
//   (`handoff-kind`);
// - a record without a descriptor (`handoff-fd-count`).
//
// A KIND_CONNECTION record is also refused when:
//
// - `generation` is 0, or isn't the VM's current generation
//   (`handoff-generation`);
// - `request_id` is 0, or doesn't name an open ConnectGuest request
//   (`handoff-unexpected`). A newer generation's request closes every
//   open request of the older one, so an older generation's request is
//   refused with `handoff-generation` above;
// - `direction` isn't DIRECTION_HOST_TO_GUEST (`handoff-direction`);
// - `destination_port` isn't the guest port that request asked for
//   (`handoff-unexpected`);
// - the descriptor isn't an AF_UNIX stream socket
//   (`handoff-socket-type`).
//
// A KIND_NETWORK record is refused with `handoff-network-refused` when
// `generation` is 0 or isn't the current one, when the generation's start
// was cancelled, already had its packet transport or asked for none, when
// `request_id`, `direction`, `source_port` or `destination_port` is set,
// or when the descriptor isn't an AF_UNIX datagram socket.
message HandoffMessage {
  // The ConnectGuest request this connection answers, at least 1. 0 in a
  // KIND_NETWORK record.
  uint64 request_id = 1;
  // The VM generation the descriptor belongs to, at least 1.
  uint64 generation = 2;
  // Unset in a KIND_NETWORK record.
  Direction direction = 3;
  // The vsock port on the side that opened the connection. 0 in a
  // KIND_NETWORK record.
  uint32 source_port = 4;
  // The vsock port on the side that accepted it. 0 in a KIND_NETWORK
  // record.
  uint32 destination_port = 5;
  // Required. KIND_UNSPECIFIED, or a kind this message doesn't name, is
  // refused with `handoff-kind`.
  Kind kind = 6;
}

// HandoffAck is not part of any RPC. wb-hostd's receiver sends one on
// the hand-off channel for each HandoffMessage record it accepts or
// refuses, once its recvmsg has returned, as one record with no
// descriptor: this message's protobuf encoding, at most 256 bytes. It
// repeats the record's `kind`, `request_id` and `generation`. A record
// that doesn't decode as a HandoffMessage, or that the channel refuses
// before it is decoded, names nothing and gets no acknowledgment.
//
// wb-vmd keeps its copy of a descriptor it sent until the HandoffAck for
// it arrives, or until the exchange's deadline passes, the connect
// timeout of 5 s, and then closes it (S07-05-stream-hand-off,
// "Transport"; S04-02-vm-provider, "Hand-off on macOS"). On macOS 27 the
// kernel can collect a socket in flight that no process holds, and it
// then arrives dead.
//
// A refused record is answered with the fields it had. One with fields
// wb-vmd never builds, such as KIND_UNSPECIFIED or generation 0, gets an
// acknowledgment that wb-vmd refuses as `handoff-ack-malformed`, and its
// copy, if any, closes at the deadline.
//
// wb-vmd refuses the record and logs the refusal with its rule, and its
// wait goes on to the deadline, when:
//
// - the record is empty, over 256 bytes, arrived truncated, or carries a
//   descriptor, which it closes (`handoff-ack-malformed`);
// - it doesn't decode as a HandoffAck, or holds a field the message
//   doesn't have (`handoff-ack-malformed`);
// - `kind` is neither KIND_CONNECTION nor KIND_NETWORK, `generation` is
//   0, a KIND_CONNECTION record has `request_id` 0, or a KIND_NETWORK
//   record has it set (`handoff-ack-malformed`);
// - it names no descriptor wb-vmd still keeps (`handoff-ack-unexpected`).
//
// wb-vmd also logs, each with its rule:
//
// - a deadline that passes without a HandoffAck, with the record's kind,
//   request ID and generation (`handoff-ack-timeout`);
// - a channel it can't read any more: a receive failed, such as with
//   ECONNRESET after wb-hostd closed its end, control data arrived
//   truncated, or a wake found nothing to read and wb-hostd's end closed
//   (`handoff-ack-channel-ended`). It stops reading, and every copy it
//   keeps closes at its deadline. darwin doesn't wake the reader for the
//   close of wb-hostd's end alone, and the copies close at their
//   deadlines then too.
//
// wb-hostd logs a HandoffAck it can't send (`handoff-ack-send-failed`).
message HandoffAck {
  // The request_id of the HandoffMessage. 0 for KIND_NETWORK.
  uint64 request_id = 1;
  // The generation of the HandoffMessage.
  uint64 generation = 2;
  // The kind of the HandoffMessage.
  Kind kind = 3;
  // True when wb-hostd accepted the record and holds its descriptor,
  // false when it refused the record and closed the descriptor. wb-vmd
  // only logs it: either way wb-hostd's recvmsg has returned.
  bool accepted = 4;
}
