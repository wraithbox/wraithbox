// The contract between wb-hostd and wb-guestd, the agent in the guest.
// wb-hostd is the client: it opens every connection, through wb-vmd's
// ConnectGuest (S04-02-vm-provider, "The host opens every connection"),
// and wb-guestd serves it.
//
// wb-guestd runs as root in the guest, which the threat model takes as
// the adversary. Every field of every message from wb-guestd is guest
// input. The host checks each one against the bounds written next to it
// before it uses it, and gives each message the same checks whatever
// version the guest reported (SEC11-root-gains-nothing).
//
// A change an older peer can't read goes in a new major package next to
// this one, never in an edit of it (S04-08-records-and-bounds, "`.proto`
// packages").
syntax = "proto3";

package wraithbox.guest.v1;

import "wraithbox/terminal/v1/terminal.proto";

// GuestService is what wb-guestd serves. The session messages of
// S06-11-reconnect-and-recovery and S06-09-session-lifecycle join it
// later as RPCs of their own, each with its own caps and checks.
service GuestService {
  // Hello is the first call on every connection the host opens
  // (S04-08-records-and-bounds, "With `wb-guestd`"). wb-hostd refuses a
  // wb-guestd whose answer fails a check below, or that reports another
  // build version than its own, before any other request.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // Shell runs a program as a project user on the terminal stream of
  // wraithbox.terminal.v1, for `wb shell` (S05-03-management-commands,
  // "`wb shell`"). The first request holds a ShellStart, and every later
  // one a client frame. Each response holds a server frame, and the last
  // one an exit or a failure. wb-hostd checks every frame against the
  // bounds of wraithbox.terminal.v1 and builds a new one for wb, so a
  // guest frame never reaches wb as it is (SEC11-root-gains-nothing).
  rpc Shell(stream ShellRequest) returns (stream ShellResponse);

  // SetTime sets the guest's clock to the host's time
  // (S06-06-devices-and-warm-start, "Time and sleep"). The guest has no
  // other clock source. wb-guestd steps the clock for a boot, a restore
  // or a wake, and whenever it is more than 1 second off, and slews it
  // otherwise. The answer is empty: wb-hostd never reads a time from the
  // guest.
  rpc SetTime(SetTimeRequest) returns (SetTimeResponse);

  // MountData mounts the VM's data volume at the home path, or checks it
  // when it is mounted there already (S06-05-disks, "Mounting the data
  // volume"). wb-hostd calls it right after every accepted hello, before
  // any other request. wb-guestd runs nothing as a project user until a
  // MountData has succeeded since wb-guestd started.
  //
  // A refusal is the status FAILED_PRECONDITION with a
  // google.rpc.ErrorInfo detail of the domain `wraithbox.guest.v1`, whose
  // reason is the rule: one of `data-volume-missing`,
  // `data-volume-encrypted`, `data-volume-mount-failed`,
  // `data-mount-point`, `data-mount-flags`, `data-mount-volume` and
  // `data-mount-root`. The host takes nothing else from a refusal. It
  // refuses with `guest-reply-invalid` an answer over 4 KiB, another
  // status code, a rule outside that list, a rule over 64 bytes or with a
  // byte outside `[a-z0-9-]`, and every other failed call. It refuses with
  // `guest-mount-timeout` an answer that doesn't come within 45 s, which
  // is longer than the guest's 30 s wait for the volume. The status
  // message is guest text: the host logs it escaped and cut, and never
  // reads it.
  rpc MountData(MountDataRequest) returns (MountDataResponse);

  // EnsureUsers makes each project user of the request exist in the
  // guest with exactly the names, IDs, GeneratedUIDs and home path given
  // (S06-03-image-updates, "Updates", step 2, and "Creation"). wb-hostd
  // allocates every value. It sends every project user of the VM's data
  // disk after each accepted MountData, and one user when a session
  // needs a new one. The request is idempotent: a user that exists with
  // these values is left as it is. wb-hostd splits a long list into
  // requests that each fit wb-guestd's receive cap.
  //
  // The answer is guest input. wb-hostd takes it only with at most one
  // result per UID, each for a UID of this request, and drops the whole
  // answer with the rule `guest-users-reply-invalid` otherwise. A user
  // with no accepted OK result is refused for the VM generation.
  rpc EnsureUsers(EnsureUsersRequest) returns (EnsureUsersResponse);

  // UnlockUser lets a project user log in and run processes again, for a
  // session start (S06-09-session-lifecycle). The answer is empty: a
  // success says the user is unlocked.
  rpc UnlockUser(UnlockUserRequest) returns (UnlockUserResponse);

  // KillUser locks a project user and stops every process it runs
  // (S06-10-leftover-processes). wb-guestd keeps a CleanupRecord of the
  // result until wb-hostd acknowledges it.
  rpc KillUser(KillUserRequest) returns (KillUserResponse);

  // RemoveUser removes a project user's record and home, for `wb project
  // rm` (S05-04-naming, "The project user"; S06-08-projects-and-sessions,
  // "Removing a home"). wb-hostd keeps the pending removal in state.db
  // until a REMOVED result for that project and UID comes back. A reply
  // never clears another project's record.
  rpc RemoveUser(RemoveUserRequest) returns (RemoveUserResponse);
}

message HelloRequest {}

message HelloResponse {
  // wb-guestd's build version. The host refuses it with the rule
  // `guest-version-form` unless it is printable ASCII, at most 64 bytes,
  // in the form MAJOR.MINOR.PATCH with an optional `-` prerelease part
  // and `+` build part of letters, digits, dots and hyphens. Wherever the
  // host shows it, it is escaped and cut to 64 bytes. The host uses it
  // only to refuse, never to allow something or to pick how a message is
  // parsed (S04-08-records-and-bounds, "The guest's version is a label").
  string guestd_version = 1;

  // The full name of each package wb-guestd serves, which ends in the
  // package's major version, for example `wraithbox.guest.v1`
  // (S04-08-records-and-bounds, "With `wb-guestd`"). The host refuses a
  // list of more than 16 names, and a name over 64 bytes or not of the
  // form `wraithbox.<lowercase letters>.v<number>`. The connection's
  // receive cap bounds the message before it is decoded, so the count is
  // never checked by counting a list of any length afterwards. The host
  // uses the list only to refuse: with a matching build version it must
  // equal the host's own list, and it never picks which package the host
  // speaks.
  repeated string served_packages = 2;
}

message ShellRequest {
  oneof msg {
    // The first request, and only the first.
    ShellStart start = 1;
    // Every later request.
    wraithbox.terminal.v1.ClientFrame frame = 2;
  }
}

// ShellStart names the shell and its user, and holds the terminal setup.
message ShellStart {
  // The shell's id, in the session id form of S05-04-naming ("Session
  // id and branch"), 1 to 128 bytes, as in ShellOpened of
  // wraithbox.hostd.v1. wb-hostd chooses it. It names the shell in the
  // guest's logs.
  string shell_id = 1;
  // The project user the shell runs as, 1 to 64 bytes. wb-guestd
  // refuses root and any user that isn't a project user of this VM.
  string user = 2;
  wraithbox.terminal.v1.Setup setup = 3;
}

// ShellResponse is one server frame. Guest input: wb-hostd checks it
// against the bounds of wraithbox.terminal.v1.
message ShellResponse {
  wraithbox.terminal.v1.ServerFrame frame = 1;
}

// TimeReason says why the host sends its time
// (S06-06-devices-and-warm-start, "When the host sends the time").
enum TimeReason {
  // Never sent. wb-guestd refuses it.
  TIME_REASON_UNSPECIFIED = 0;
  // After a cold boot. wb-guestd steps the clock.
  TIME_REASON_BOOT = 1;
  // After a restore from saved state. wb-guestd steps the clock.
  TIME_REASON_RESTORE = 2;
  // After a host wake. wb-guestd steps the clock.
  TIME_REASON_WAKE = 3;
  // The update every 60 seconds while the VM runs. wb-guestd slews the
  // clock, unless it is more than 1 second off.
  TIME_REASON_PERIODIC = 4;
}

message SetTimeRequest {
  // The host's wall clock when it sent the request, in nanoseconds since
  // the Unix epoch, UTC. wb-guestd refuses a value of 0 or less.
  int64 unix_nanos = 1;
  TimeReason reason = 2;
}

// SetTimeResponse is empty, so the guest has no time to send back.
message SetTimeResponse {}

message MountDataRequest {
  // The data volume's UUID as wb-hostd recorded it at format time, in
  // canonical form: 36 bytes of uppercase hexadecimal digits and hyphens
  // (S06-13-data-disk-format). wb-guestd mounts only the volume with this
  // UUID, and refuses a request with another form.
  string volume_uuid = 1;

  // Set while wb-hostd's record says the volume has never been mounted in
  // a guest. Only then does wb-guestd make the volume root owned by
  // root:wheel with mode 755 (S06-05-disks, "Owners and modes"). On any
  // other mount it only checks them.
  bool first_mount = 2;
}

// MountDataResponse is empty: a success says the volume is mounted and
// passed every check, and the host reads nothing else from the guest.
message MountDataResponse {}

// ProjectUser is one project user as wb-hostd keeps it in state.db
// (S06-03-image-updates, "Host state per project user"). wb-hostd makes
// every field. wb-guestd refuses a user whose name, UID or GID exists
// with other values, and a home that exists and is owned by another UID.
message ProjectUser {
  // The project's id: 32 lowercase hexadecimal digits (S05-04-naming,
  // "Project id").
  string project_id = 1;
  // The user's short name, `wbp<uid>`, at most 16 bytes.
  string user_name = 2;
  // The UID and GID: one number from wb-hostd's counter, from 10000 up
  // to the ceiling of internal/projectuser, never reused on this host.
  uint32 uid = 3;
  uint32 gid = 4;
  // The name of the user's own group, equal to the user name.
  string group_name = 5;
  // The GeneratedUID of the user's record and of its group's: uppercase
  // version 4 UUIDs, 36 bytes, that wb-hostd drew from crypto/rand.
  string user_generated_uid = 6;
  string group_generated_uid = 7;
  // The home: the data volume's mount point, a slash and the user name.
  string home_path = 8;
}

message EnsureUsersRequest {
  // At least one user. Every UID, user name and GeneratedUID is distinct.
  repeated ProjectUser users = 1;
}

// EnsureUsersResponse is guest input. wb-hostd decodes at most 16 KiB of
// it. It drops the whole answer with the rule `guest-users-reply-invalid`
// when it is larger, holds a result for a UID that wasn't in the
// request, holds two results for one UID, or holds a result that breaks
// a bound of EnsureUserResult.
message EnsureUsersResponse {
  repeated EnsureUserResult results = 1;
}

enum EnsureResult {
  // Never sent. wb-hostd drops an answer that holds it, or a value it
  // doesn't know.
  ENSURE_RESULT_UNSPECIFIED = 0;
  // The user exists with every value of the request.
  ENSURE_RESULT_OK = 1;
  // wb-guestd refused the user, and rule says why.
  ENSURE_RESULT_REFUSED = 2;
}

message EnsureUserResult {
  // The UID of a user of the request.
  uint32 uid = 1;
  EnsureResult result = 2;
  // Empty with OK. With REFUSED, the rule: 1 to 64 bytes of `[a-z0-9-]`.
  // wb-hostd logs it escaped, and it only ever refuses the user.
  string rule = 3;
}

message UnlockUserRequest {
  // The UID of a project user of this VM.
  uint32 uid = 1;
}

// UnlockUserResponse is empty: a success says the user is unlocked.
message UnlockUserResponse {}

message KillUserRequest {
  // The kill ID, which wb-hostd assigns, never 0
  // (S06-10-leftover-processes, "Kill IDs and records").
  uint64 kill_id = 1;
  // The project's id, as in ProjectUser.
  string project_id = 2;
  // The UID of the project's user in this VM.
  uint32 uid = 3;
}

enum KillResult {
  // Never sent. wb-hostd drops an answer that holds it, or a value it
  // doesn't know.
  KILL_RESULT_UNSPECIFIED = 0;
  // No process of the user is left.
  KILL_RESULT_CLEAN = 1;
  // Processes of the user are left, as many as processes_left says.
  KILL_RESULT_PROCESSES_LEFT = 2;
}

// KillUserResponse is guest input. wb-hostd takes it only for the kill ID
// and project ID it sent, with the bounds of CleanupRecord.
message KillUserResponse {
  uint64 kill_id = 1;
  string project_id = 2;
  KillResult result = 3;
  // With PROCESSES_LEFT, 1 to 1001. 0 with CLEAN.
  uint32 processes_left = 4;
}

// CleanupRecord is the result of a kill. wb-guestd keeps it in its
// root-owned directory until wb-hostd acknowledges it, and lists it at
// reconnect (S06-10-leftover-processes, S06-11-reconnect-and-recovery,
// "The list"). It is guest input: wb-hostd checks the project ID's form,
// takes the result only for a kill ID it sent for that project in this
// VM generation, and never counts a dropped result as clean.
message CleanupRecord {
  uint64 kill_id = 1;
  string project_id = 2;
  KillResult result = 3;
  // With PROCESSES_LEFT, 1 to 1001. 0 with CLEAN.
  uint32 processes_left = 4;
}

message RemoveUserRequest {
  // The project's id, as in ProjectUser.
  string project_id = 1;
  // The UID and GID the user had, and its home path.
  uint32 uid = 2;
  uint32 gid = 3;
  string home_path = 4;
}

enum RemoveResult {
  // Never sent. wb-hostd drops an answer that holds it, or a value it
  // doesn't know.
  REMOVE_RESULT_UNSPECIFIED = 0;
  // The user's record and home are removed, or were never there.
  REMOVE_RESULT_REMOVED = 1;
  // Processes of the user are left, as many as processes_left says.
  // wb-hostd keeps the pending removal and sends it again at the next
  // connection.
  REMOVE_RESULT_PROCESSES_LEFT = 2;
  // wb-guestd refused the removal, and rule says why. wb-hostd keeps the
  // pending removal and sends it again at the next connection.
  REMOVE_RESULT_REFUSED = 3;
}

// RemoveUserResponse is guest input. wb-hostd decodes at most 4 KiB of
// it. It drops the answer with the rule `guest-users-reply-invalid`
// unless its project ID and UID are the request's and its fields keep
// these bounds. A dropped answer keeps the pending removal.
message RemoveUserResponse {
  string project_id = 1;
  uint32 uid = 2;
  RemoveResult result = 3;
  // With PROCESSES_LEFT, 1 to 1001. 0 otherwise.
  uint32 processes_left = 4;
  // With REFUSED, the rule: 1 to 64 bytes of `[a-z0-9-]`. Empty
  // otherwise. wb-hostd logs it escaped.
  string rule = 5;
}
