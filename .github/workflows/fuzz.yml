name: Fuzz

# The daily fuzz run (S11-verification-and-spikes, "Fuzzing"): every Go
# fuzz target for a share of 10 minutes, through `mise run go:fuzz-long`,
# which runs the same way locally. The fuzz smoke run in ci.yml is too
# short to find much that is new. This run is long enough to. A failure
# prints the failing input in the log, so it can be committed under the
# package's testdata/fuzz.
on:
  schedule:
    # Once a day, off the hour, when hosted runners are less busy.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A manual run waits for the scheduled one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (daily)
    runs-on: ubuntu-26.04
    # 10 minutes of fuzzing, plus setup and building the test binaries.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: go
          cache: true

      # Go keeps the inputs that found new coverage under
      # $GOCACHE/fuzz. Kept between runs, each day's fuzzing starts from
      # what the earlier days found and not from the seeds alone. A cache
      # entry can't be changed, so each run saves a new one, under its
      # run ID, and restores the newest. Only this workflow writes these
      # entries, and pull request runs can't write to main's cache.
      - name: Find the fuzz corpus
        id: corpus
        run: echo "dir=$(mise exec -- go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Cache the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-

      - name: Fuzz run
        run: mise run go:fuzz-long
