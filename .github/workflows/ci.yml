name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main, so
# the main-branch CI history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides which of the go and swift jobs and the docs site steps a pull
  # request needs, from the files it changes (scripts/ci-changes.mjs).
  # A push to main and workflow_dispatch run everything. When this job
  # fails, the others run as if every file changed, and `CI result` fails.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.detect.outputs.go }}
      swift: ${{ steps.detect.outputs.swift }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      # Depth 2: a pull request checks out its merge commit, and the diff
      # is against the merge commit's first parent, the base branch.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: bun
          cache: true

      - name: Detect changed inputs
        id: detect
        run: bun scripts/ci-changes.mjs detect

  go:
    name: Go (${{ matrix.os }})
    # Most Wraith Box code is cross-platform Go (S12-platforms), so it is
    # linted, vetted, tested and built natively on every host OS from the
    # start. See docs/spec/S02-toolchain.md.
    #
    # Skipped only when detection succeeded and found no Go input changed.
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.go == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history on Linux only: the contracts step compares the .proto
      # files with origin/main (`buf breaking`).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ runner.os == 'Linux' && '0' || '1' }}

      # Only the Go tools and buf: the full list includes tools (SwiftLint)
      # that have no Windows or Linux build.
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: go golangci-lint gofumpt buf
          cache: true

      - name: Lint + format check
        run: mise run go:lint

      # One OS is enough: the check reads .proto files and compares text.
      # Its task is a Unix shell script, like go:cross.
      - name: Contracts (buf lint + breaking + Go drift)
        if: ${{ runner.os == 'Linux' }}
        run: mise run proto:check

      - name: Vet
        run: mise run go:vet

      - name: Test
        run: mise run go:test

      - name: Build
        run: mise run go:build

  swift:
    name: Swift
    # Swift comes from the runner image's default Xcode; Package.swift's
    # tools version (6.2) is the floor. See docs/spec/S02-toolchain.md.
    #
    # Skipped only when detection succeeded and found no Swift input
    # changed.
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.swift == 'false') }}
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: swiftlint buf
          cache: true

      - name: Lint (swift-format + SwiftLint)
        run: mise run swift:lint

      - name: Contracts (Swift drift)
        run: mise run proto:check-swift

      - name: Build
        run: mise run swift:build

      - name: Test
        run: mise run swift:test

  docs:
    name: Docs
    # Runs on every pull request: cspell checks every tracked file, code
    # included. Only the site check and build steps are skipped when
    # detection found no docs input changed.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/wraithbox-doc/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Frozen: a docs package.json change that
      # bun.lock does not reflect is an error, not a re-resolve.
      - name: Install
        run: mise run doc:install-frozen

      # Prose checks for the whole repository, not just the site: Vale
      # over every Markdown/MDX file, cspell over every tracked text file.
      # They run here because cspell comes from the docs package's
      # bun-locked install above.
      - name: Prose lint (Vale)
        run: mise run prose:lint

      - name: Spell check (cspell)
        run: mise run prose:spell

      - name: Check (Astro type/content check)
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.docs == 'false') }}
        run: mise run doc:check

      - name: Build
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.docs == 'false') }}
        run: mise run doc:build

  vuln:
    name: Dependency vulnerability scan
    # go:vulncheck analyses the darwin, linux and windows builds itself
    # (GOOS), so one Linux runner covers every host OS.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: go bun osv-scanner go:golang.org/x/vuln/cmd/govulncheck
          cache: true

      # Its own job rather than steps in the per-language jobs: this one
      # fails on a newly published advisory against an unchanged tree, so
      # it has to be able to go red without implying the code broke.
      #
      # Runs the same `mise run vuln` a developer runs (osv-scanner over
      # every lockfile and govulncheck for the Go toolchain), so there is
      # one definition of the check rather than two that can drift.
      - name: Scan every lockfile (osv-scanner + govulncheck)
        run: mise run vuln

  actions:
    name: GitHub Actions (lint + audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the two tools this job needs; installing the whole polyglot
      # toolchain here would cost minutes for a workflow linter.
      #
      # Caveat worth knowing before copying this to the other jobs: mise
      # can auto-install a missing tool when `mise run` reaches for it, so
      # an `install_args` list that is too narrow shows up as a slower job,
      # not a failing one. Check the timings, not just the color.
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: actionlint shellcheck
          cache: true

      - name: Lint workflows (actionlint + shellcheck)
        run: mise run gha:lint

      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          # The action's own defaults are version "latest", collect
          # "default" and inputs ".". Pin the version so a zizmor release
          # cannot turn CI red on its own, and set collect: all so
          # .github/dependabot.yml is audited too. Scope inputs to
          # .github because --collect=all otherwise walks node_modules
          # once the docs site is installed. All three must match
          # `mise run audit` for that task to be a real local mirror.
          # Bump the version in both places together.
          version: "1.30.1"
          collect: all
          inputs: .github

  # The one required check (docs/github-settings.md). A skipped matrix job
  # never reports its per-OS check names, so the ruleset cannot require
  # those. This job fails unless every job passed or was skipped because
  # `changes` found its inputs unchanged. always(), not !cancelled(): a
  # skipped required check counts as passed, so this job has to run, and
  # fail, when the run is cancelled.
  result:
    name: CI result
    needs: [changes, go, swift, docs, actions]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: bun
          cache: true

      - name: Check every job passed or was skipped by detection
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/ci-changes.mjs verdict
