name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main, so
# the main-branch CI history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides which of the go and swift jobs, the Swift bundle steps and the
  # docs site steps a pull request needs, from the files it changes
  # (scripts/ci-changes.mjs).
  # A push to main and workflow_dispatch run everything. When this job
  # fails, the others run as if every file changed, and `CI result` fails.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.detect.outputs.go }}
      swift: ${{ steps.detect.outputs.swift }}
      bundle: ${{ steps.detect.outputs.bundle }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      # Depth 2: a pull request checks out its merge commit, and the diff
      # is against the merge commit's first parent, the base branch.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          install_args: bun
          cache: true

      - name: Detect changed inputs
        id: detect
        run: bun scripts/ci-changes.mjs detect

  go:
    name: Go (${{ matrix.os }})
    # Most Wraith Box code is cross-platform Go (S12-platforms), so it is
    # linted, vetted, tested and built natively on every host OS from the
    # start. See docs/spec/S02-toolchain.md.
    #
    # Skipped only when detection succeeded and found no Go input changed.
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.go == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history on Linux only: the contracts step compares the .proto
      # files with origin/main (`buf breaking`).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ runner.os == 'Linux' && '0' || '1' }}

      # Only the Go tools and buf: the full list includes tools (SwiftLint)
      # that have no Windows or Linux build.
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          install_args: go golangci-lint gofumpt buf
          cache: true

      - name: Lint + format check
        run: mise run go:lint

      # One OS is enough: the check reads .proto files and compares text.
      # Its task is a Unix shell script, like go:cross.
      - name: Contracts (buf lint + breaking + Go drift)
        if: ${{ runner.os == 'Linux' }}
        run: mise run proto:check

      - name: Vet
        run: mise run go:vet

      - name: Test
        run: mise run go:test

      # The fuzz smoke run (S11-verification-and-spikes). One OS is enough:
      # the targets parse bytes the same way on every OS, and fuzzing on
      # three runners would triple the time.
      - name: Fuzz smoke run
        if: ${{ runner.os == 'Linux' }}
        run: mise run go:fuzz

      - name: Build
        run: mise run go:build

  swift:
    name: Swift
    # Swift comes from the runner image's default Xcode; Package.swift's
    # tools version (6.4, Xcode 27) is the floor. The `xcode-27` image is
    # macOS 27 with Xcode 27, because the package targets macOS 27
    # (NFR04-host-platforms). See docs/spec/S02-toolchain.md.
    #
    # Skipped only when detection succeeded and found neither a Swift
    # input nor a bundle input changed. A change to the Go module alone
    # runs only the build, sign and bundle steps (`bundle`), because the
    # bundle holds the Go programs. Every Swift input runs them all
    # (`swift`), and so do the Go files swift:build reads: go.mod, go.sum,
    # internal/version and internal/tools/buildversion.
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.swift == 'false' && needs.changes.outputs.bundle == 'false') }}
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          install_args: swiftlint buf go
          cache: true

      # SwiftPM's .build holds the compiled dependencies (SwiftProtobuf,
      # swift-crypto with BoringSSL, swift-nio, gRPC), debug and release,
      # which take most of this job to build from source (#354). The key
      # is the runner image, the architecture, the Xcode version and the
      # package manifest and lock. A run with no exact match restores the
      # newest cache of the same image, architecture and Xcode
      # (restore-keys). Restored on every run, saved only by a push to main
      # (the save step below), so a pull request never writes a cache that
      # main restores. A miss or a stale cache only costs time: SwiftPM
      # rebuilds what changed, and tests always run.
      - name: Swift build cache key
        id: swift-cache-key
        run: |
          xcode=$(xcodebuild -version | shasum -a 256 | cut -c 1-16)
          echo "prefix=swift-build-${ImageOS}-${ImageVersion}-${RUNNER_ARCH}-xcode-${xcode}-" >>"$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/wraithbox-swift/.build
          key: ${{ steps.swift-cache-key.outputs.prefix }}${{ hashFiles('packages/wraithbox-swift/Package.resolved', 'packages/wraithbox-swift/Package.swift') }}
          restore-keys: ${{ steps.swift-cache-key.outputs.prefix }}

      - name: Lint (swift-format + SwiftLint)
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.swift == 'false') }}
        run: mise run swift:lint

      - name: Contracts (Swift drift)
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.swift == 'false') }}
        run: mise run proto:check-swift

      # Test before Build, as `mise run ci` orders them: `swift test`
      # relinks the programs without the version stamp, so the stamped
      # build goes last.
      - name: Test
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.swift == 'false') }}
        run: mise run swift:test

      - name: Build
        run: mise run swift:build

      - name: Sign wb-vmd (ad-hoc, hardened runtime)
        run: mise run swift:sign

      # `Wraith Box.app`, ad-hoc signed, and its entitlement check
      # (S17-01-bundle, "Output"). No WB_TEAM_ID: CI has no Apple
      # Development identity, so the team-signed build runs on the
      # maintainer's Mac only.
      - name: Bundle (ad-hoc Wraith Box.app + entitlement check)
        run: mise run app:bundle

      # Deletes, just before the save and only when it saves, what the next
      # run builds again or never reads. The cache then holds mostly the
      # compiled dependencies (#362). It deletes the bundle work directory
      # and outputs, which app:bundle deletes first; the package's own
      # programs and test bundle, which link the package's own modules and
      # so link again after every checkout; the debug symbols (.dSYM) of
      # the linked programs; and the index store, which no build reads. A
      # delete and not `!` patterns in `path`: actions/cache hands the
      # directories it matches to tar, which takes everything below them.
      # The paths follow the layout of Swift Build, the default build
      # system of SwiftPM 6.4 in Xcode 27 (#468): products in
      # .build/out/Products/<Debug|Release> and the index store in
      # .build/out/v5. The step fails when the product directories are
      # missing, so a new layout can't make it delete nothing.
      # The checkouts stay, because they borrow their git objects from
      # .build/repositories. The package's own target objects and modules
      # stay too: every run compiles them again, but the largest is about
      # 5 MB of 1.4 GB, and deleting them would need a list of names.
      #
      # The trade-off (#362): one cache of about 0.5 GB compressed (0.7 GB
      # untrimmed) per runner image, Xcode, Package.swift and
      # Package.resolved, against about 9 of the job's 14 minutes. A new
      # image every week or so adds an entry. The old one, no longer
      # restored, is the first that GitHub's least recently used eviction
      # removes under the repository's 10 GB limit, before the bun and
      # mise caches that every run restores.
      - name: Trim Swift build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true' }}
        working-directory: packages/wraithbox-swift/.build
        run: |
          shopt -s nullglob
          for config in out/Products/Debug out/Products/Release; do
            if [ ! -d "$config" ]; then
              echo "Trim: expected $config in .build, found none; the build layout changed, so update this step" >&2
              exit 1
            fi
          done
          rm -rf -- app-work signed "Wraith Box.app"
          rm -rf -- out/Products/*/*.dSYM out/Products/*/*.xctest out/v5
          rm -f -- out/Products/*/wb-vmd out/Products/*/wb-dev-bundle
          du -sh .

      # Only a push to main saves, and only when no cache had this exact
      # key: a pull request run restores main's cache and saves nothing.
      - name: Save Swift build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/wraithbox-swift/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  docs:
    name: Docs
    # Runs on every pull request: cspell checks every tracked file, code
    # included. Only the site check and build steps are skipped when
    # detection found no docs input changed.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/wraithbox-doc/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Frozen: a docs package.json change that
      # bun.lock does not reflect is an error, not a re-resolve.
      - name: Install
        run: mise run doc:install-frozen

      # Prose checks for the whole repository, not just the site: Vale
      # over every Markdown/MDX file, cspell over every tracked text file.
      # They run here because cspell comes from the docs package's
      # bun-locked install above.
      - name: Prose lint (Vale)
        run: mise run prose:lint

      - name: Spell check (cspell)
        run: mise run prose:spell

      - name: Check (Astro type/content check)
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.docs == 'false') }}
        run: mise run doc:check

      - name: Build
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.docs == 'false') }}
        run: mise run doc:build

  vuln:
    name: Dependency vulnerability scan
    # go:vulncheck analyses the darwin, linux and windows builds itself
    # (GOOS), so one Linux runner covers every host OS.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          install_args: go bun osv-scanner go:golang.org/x/vuln/cmd/govulncheck
          cache: true

      # Its own job rather than steps in the per-language jobs: this one
      # fails on a newly published advisory against an unchanged tree, so
      # it has to be able to go red without implying the code broke.
      #
      # Runs the same `mise run vuln` a developer runs (osv-scanner over
      # every lockfile and govulncheck for the Go toolchain), so there is
      # one definition of the check rather than two that can drift.
      - name: Scan every lockfile (osv-scanner + govulncheck)
        run: mise run vuln

  actions:
    name: GitHub Actions (lint + audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the two tools this job needs; installing the whole polyglot
      # toolchain here would cost minutes for a workflow linter.
      #
      # Caveat worth knowing before copying this to the other jobs: mise
      # can auto-install a missing tool when `mise run` reaches for it, so
      # an `install_args` list that is too narrow shows up as a slower job,
      # not a failing one. Check the timings, not just the color.
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          install_args: actionlint shellcheck
          cache: true

      - name: Lint workflows (actionlint + shellcheck)
        run: mise run gha:lint

      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          # The action's own defaults are version "latest", collect
          # "default" and inputs ".". Pin the version so a zizmor release
          # cannot turn CI red on its own, and set collect: all so
          # .github/dependabot.yml is audited too. Scope inputs to
          # .github because --collect=all otherwise walks node_modules
          # once the docs site is installed. All three must match
          # `mise run audit` for that task to be a real local mirror.
          # Bump the version in both places together.
          version: "1.31.1"
          collect: all
          inputs: .github

  # The one required check (docs/github-settings.md). A skipped matrix job
  # never reports its per-OS check names, so the ruleset cannot require
  # those. This job fails unless every job passed or was skipped because
  # `changes` found its inputs unchanged. always(), not !cancelled(): a
  # skipped required check counts as passed, so this job has to run, and
  # fail, when the run is cancelled.
  result:
    name: CI result
    needs: [changes, go, swift, docs, actions]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          install_args: bun
          cache: true

      - name: Check every job passed or was skipped by detection
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/ci-changes.mjs verdict
