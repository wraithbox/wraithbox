# Renovate for this repository, self-hosted (S02-toolchain, "Dependency
# updates"). The policy is in renovate.json; all of Renovate's global
# config is here, as RENOVATE_* variables. Modeled on lsimons/.github, but
# independent of it: its own GitHub App in the wraithbox organization, and
# only this repository. Setup: docs/github-settings.md, "Renovate".
#
# Daily at 01:17 UTC. New update PRs only open on Mondays (renovate.json's
# schedule); the other days merge what is green and pick up security
# fixes, which ignore both the schedule and the 7-day wait. A manual run
# ignores the schedule by default (force).
#
# A round:
#   1. mints an App token for this repository only,
#   2. runs Renovate: opens or updates PRs, merges green automerge PRs (at
#      most two per round), rebases PRs that fell behind or conflict,
#   3. waits for CI on Renovate's open PRs and on main,
#   4. writes a summary, and
#   5. dispatches the next round if a green automerge PR is left (or one
#      Renovate will rebase), at most 5.
#
# Renovate runs from its container image, pinned below, rather than through
# renovatebot/github-action. The action only wraps `docker run`, and this
# way no third-party action holds the App token or needs an allowlist entry.
name: Renovate
run-name: Renovate${{ inputs.round > 1 && format(' round {0}', inputs.round) || '' }}

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (off = live)"
        type: choice
        options: ["off", "lookup", "full"]
        default: "off"
      force:
        description: "Ignore the Monday schedule: take everything that is due now"
        type: boolean
        default: true
      logLevel:
        type: choice
        options: ["info", "debug"]
        default: "info"
      repoCache:
        description: "Repository cache"
        type: choice
        options: ["enabled", "reset"]
        default: "enabled"
      round:
        description: "Set by the previous round; leave at 1"
        type: number
        default: 1

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  MAX_ROUNDS: 5

jobs:
  renovate:
    name: Renovate round ${{ inputs.round || 1 }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    # The App's secrets are environment secrets of `renovate`, which only
    # main may deploy to. A workflow on another branch, which anyone with
    # write access can push, can't read the App key.
    environment: renovate
    permissions:
      contents: read
      actions: write # dispatch the next round
    steps:
      # Scoped to this repository, with what Renovate needs (its GitHub App
      # docs). The App must grant at least these.
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Record token time
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repo-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: renovate-repo-cache-

      # The image runs as uid 12021 (containerbase).
      - name: Hand cache to the Renovate container user
        run: |
          mkdir -p /tmp/renovate
          sudo chown -R 12021:0 /tmp/renovate

      # Keep the image tag equal to the one in the renovate:validate task
      # in .mise.toml; Renovate bumps both in one PR. `--env NAME` passes
      # the value from this step's environment, so the token is not on the
      # command line.
      - name: Renovate
        id: renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}
          # mise.lock is regenerated with `mise lock`.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPORT_PATH: /tmp/renovate/report.json
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'off' && inputs.dryRun || '' }}
          # A scheduled run has no inputs, so force is off.
          RENOVATE_FORCE: ${{ inputs.force && '{"schedule":["at any time"],"lockFileMaintenance":{"schedule":["at any time"]}}' || '' }}
        run: |
          docker run --rm \
            --volume /tmp/renovate:/tmp/renovate \
            --env RENOVATE_TOKEN --env LOG_LEVEL --env RENOVATE_PLATFORM \
            --env RENOVATE_REPOSITORIES --env RENOVATE_ONBOARDING \
            --env RENOVATE_REQUIRE_CONFIG --env RENOVATE_PLATFORM_COMMIT \
            --env RENOVATE_REPOSITORY_CACHE --env RENOVATE_ALLOWED_UNSAFE_EXECUTIONS \
            --env RENOVATE_REPORT_TYPE --env RENOVATE_REPORT_PATH \
            --env RENOVATE_DRY_RUN --env RENOVATE_FORCE \
            ghcr.io/renovatebot/renovate:44.205.2

      - name: Wait for CI and summarize
        id: wait
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          STARTED_AT: ${{ steps.start.outputs.at }}
          ROUND: ${{ inputs.round || 1 }}
          DRY_RUN: ${{ inputs.dryRun != 'off' && inputs.dryRun || '' }}
          RENOVATE_OUTCOME: ${{ steps.renovate.outcome }}
        run: |
          set -euo pipefail
          # App tokens live 60 minutes; stop polling at 50.
          deadline=$((STARTED_AT + 50 * 60))

          # Check runs have status/conclusion; commit statuses have state.
          # "none" means no checks at all, which Renovate treats as pending
          # and never automerges.
          checks='def checks:
            if length == 0 then "none"
            elif any(.[]; ((.status // "COMPLETED") | ascii_upcase) != "COMPLETED"
                       or ((.state // "") | ascii_upcase | IN("PENDING", "EXPECTED"))) then "pending"
            elif any(.[]; ((.conclusion // "") | ascii_upcase | IN("FAILURE", "TIMED_OUT", "CANCELLED", "ACTION_REQUIRED", "STARTUP_FAILURE"))
                       or ((.state // "") | ascii_upcase | IN("FAILURE", "ERROR"))) then "red"
            else "green" end;'

          # CI state of a commit: none, pending, red, green, or held.
          # - This run's own job is left out: it is a check run on main,
          #   pending until this step ends.
          # - renovate/stability-days is Renovate's release-age hold, not
          #   CI. It only changes when Renovate runs again, so waiting on it
          #   is pointless: "held" unless the real checks are red/pending.
          commit_state() {
            local ref=$1 runs statuses
            # shellcheck disable=SC2016 # $ENV is jq's, not the shell's
            runs=$(gh api "repos/$REPO/commits/$ref/check-runs?per_page=100" \
              --jq '[.check_runs[] | select((.details_url // "") | contains("/actions/runs/\($ENV.GITHUB_RUN_ID)/") | not) | {status, conclusion}]')
            statuses=$(gh api "repos/$REPO/commits/$ref/status" --jq '[.statuses[] | {context, state}]')
            jq -rn --argjson runs "$runs" --argjson statuses "$statuses" "$checks"'
              ($statuses | map(select(.context == "renovate/stability-days" and .state == "pending")) | length > 0) as $held
              | ($runs + ($statuses | map(select(.context != "renovate/stability-days") | {state})) | checks) as $s
              | if $held and ($s == "green" or $s == "none") then "held" else $s end'
          }

          # prs.tsv: number, checks, automerge, mergeable, url, title
          snapshot() {
            : > /tmp/prs.tsv
            gh pr list -R "$REPO" --author "app/$APP_SLUG" --state open --limit 100 \
              --json number,title,url,body,mergeable,headRefOid \
              --jq '.[] | [(.number | tostring), .headRefOid,
                      (if ((.body // "") | contains("**Automerge**: Enabled")) then "yes" else "no" end),
                      .mergeable, .url, .title] | @tsv' > /tmp/open-prs.tsv
            while IFS=$'\t' read -r number sha automerge mergeable url title; do
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$number" "$(commit_state "$sha")" \
                "$automerge" "$mergeable" "$url" "$title" >> /tmp/prs.tsv
            done < /tmp/open-prs.tsv
            main_state=$(commit_state "$BRANCH")
          }

          if [ -n "$DRY_RUN" ]; then
            snapshot
          else
            sleep 60 # let CI register runs for what Renovate just pushed
            while :; do
              snapshot
              pending=$( (cut -f2 /tmp/prs.tsv; echo "$main_state") | grep -c '^pending$' || true)
              [ "$pending" -eq 0 ] && break
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::warning::Stopped waiting with $pending check set(s) still pending (token deadline)"
                break
              fi
              echo "$(date -u +%H:%M:%S) waiting on $pending pending check set(s)"
              sleep 60
            done
          fi

          # Another round helps if Renovate would merge (green), rebase
          # (conflicting) or just has not seen the result yet (pending).
          # Not for "held": the release age does not pass within a run.
          more=$(awk -F'\t' '$3 == "yes" && ($2 == "green" || $2 == "pending" || $4 == "CONFLICTING")' /tmp/prs.tsv | wc -l)

          awk -F'\t' '$2 == "red" { print "::warning::Red CI on Renovate PR " $5 }' /tmp/prs.tsv
          if [ "$main_state" = red ]; then echo "::warning::Red CI on $BRANCH"; fi

          {
            echo "## Renovate round $ROUND of at most $MAX_ROUNDS"
            echo
            [ -n "$DRY_RUN" ] && echo "Dry run ($DRY_RUN): nothing was pushed or merged." && echo
            [ "$RENOVATE_OUTCOME" != "success" ] && echo "**Renovate step: $RENOVATE_OUTCOME.** See its log." && echo
            if [ -s /tmp/prs.tsv ]; then
              echo "| PR | Checks | Automerge | Mergeable |"
              echo "|---|---|---|---|"
              awk -F'\t' '{ t = $6; gsub(/\|/, "\\|", t); printf "| [#%s](%s) %s | %s | %s | %s |\n", $1, $5, t, $2, $3, $4 }' /tmp/prs.tsv
            else
              echo "No open Renovate PRs."
            fi
            echo
            echo "CI on \`$BRANCH\`: $main_state"
            echo
            if cut -f2 /tmp/prs.tsv | grep -qx held; then
              echo "held: CI is green, but an update is younger than the minimum release age (\`renovate/stability-days\`). A later run merges it."
              echo
            fi
            if [ "$more" -eq 0 ]; then
              echo "Done: nothing left that Renovate can merge. See the Dependency Dashboard issue for pending, held and failed updates."
            elif [ -n "$DRY_RUN" ] || [ "$RENOVATE_OUTCOME" != "success" ]; then
              echo "$more PR(s) could progress, but no next round after a dry run or a failed Renovate step."
            elif [ "$ROUND" -ge "$MAX_ROUNDS" ]; then
              echo "**Stopped after $MAX_ROUNDS rounds with $more PR(s) still able to progress.**"
            else
              echo "$more PR(s) can progress: dispatching round $((ROUND + 1))."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$more" -gt 0 ] && [ "$ROUND" -ge "$MAX_ROUNDS" ]; then
            echo "::warning::Stopped after $MAX_ROUNDS rounds with $more PR(s) still able to progress"
          fi
          echo "more=$([ "$more" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save repository cache
        if: ${{ !cancelled() && steps.renovate.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repo-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload report
        if: ${{ !cancelled() && steps.renovate.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-report
          path: /tmp/renovate/report.json
          retention-days: 14
          if-no-files-found: ignore

      # Runs under this workflow's concurrency group, so the next round
      # starts when this one has finished. workflow_dispatch is one of the
      # events GITHUB_TOKEN may trigger.
      - name: Dispatch the next round
        if: >-
          ${{ steps.wait.outputs.more == 'true' && steps.renovate.outcome == 'success'
          && (inputs.dryRun || 'off') == 'off' && (inputs.round || 1) < fromJSON(env.MAX_ROUNDS) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          ROUND: ${{ inputs.round || 1 }}
          FORCE: ${{ inputs.force || false }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        run: |
          gh workflow run renovate.yml -R "$GITHUB_REPOSITORY" --ref "$REF" \
            -f round="$((ROUND + 1))" -f force="$FORCE" -f logLevel="$LOG_LEVEL"
