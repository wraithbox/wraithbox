name: Feature request
description: Propose new behavior or a change to existing behavior.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Design lives in [`docs/spec/`](https://github.com/wraithbox/wraithbox/tree/main/docs/spec).
        A feature that changes a design decision changes the spec first. A
        feature never weakens a security control (`SEC*`, SEC00-index).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why Wraith Box does not let you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Commands, flags, or behavior as you would use them.
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Affected specs and requirements
      description: Specs (`S*`) and requirement IDs (`FR*`, `NFR*`, `SEC*`) this touches. Note any security control it interacts with.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
