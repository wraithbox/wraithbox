# actionlint configuration (`mise run gha:lint`).
#
# GitHub-hosted runner labels that the pinned actionlint doesn't know
# yet. Each one is a hosted image, not a self-hosted runner: actionlint
# has no other way to accept an unknown label. Remove a label once
# actionlint lists it.
self-hosted-runner:
  labels:
    # macOS 27 with Xcode 27, in public preview, for the Swift job
    # (docs/spec/S02-toolchain.md, NFR04-host-platforms).
    - xcode-27
