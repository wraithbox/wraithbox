<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 590" role="img" aria-label="The critical path to V1. Spikes on the left unblock three lanes of work: the VM boots and wb shell opens as a project user; wb-netd and wb-proxyd carry the guest's network; the git round trip and the proxy lead to wb claude end to end.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.guest { fill: #e8eef8; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.arrow { fill: #5e5c64; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
.lane { fill: #1c71d8; font-size: 12.5px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.guest { fill: #2b3340; }
.edge { stroke: #c0bfbc; }
.arrow { fill: #c0bfbc; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
.lane { fill: #99c1f1; }
}
</style>
