<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-label="The components the train touches. On the host, wb-hostd, wb-proxyd and wb-netd changed in code, so that a fresh start clears wb-proxyd's state for a VM and a new active period clears its wildcard count. wb-vmd changed in code to give wb-vmd-layer a layer slot that refuses provisioning options. Beside the train, an open design adds a third entry of wb-diskfmt, which copies the host's Xcode and exported runtimes onto a disk image that a build VM with no network gets read-only, where wb-guestd installs them as root.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.change-code { fill: #fde7c4; stroke: #c64600; stroke-width: 2.5; }
.change-open { fill: #f6f5f4; stroke: #77767b; stroke-width: 2; stroke-dasharray: 3 3; }
.region { fill: none; stroke: #9a9996; stroke-width: 1.5; }
.boundary { fill: none; stroke: #c01c28; stroke-width: 2; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.arrow { fill: #5e5c64; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #3d3846; font-size: 12.5px; }
.region-label { fill: #5e5c64; font-size: 13px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.change-code { fill: #4a3214; stroke: #ffa348; }
.change-open { fill: #2e2e31; stroke: #9a9996; }
.region { stroke: #77767b; }
.boundary { stroke: #ff7b7b; }
.edge { stroke: #c0bfbc; }
.arrow { fill: #c0bfbc; }
.label { fill: #ffffff; }
.note { fill: #deddda; }
.region-label { fill: #c0bfbc; }
}
</style>
<defs>
<marker id="w622-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>
<rect class="region" x="15" y="30" width="690" height="445" rx="10" />
<text class="region-label" x="30" y="52">host, runs as the user</text>
<rect class="boundary" x="730" y="30" width="255" height="445" rx="10" />
<text class="region-label" x="745" y="52">macOS guest VMs</text>
<rect class="change-code" x="30" y="70" width="200" height="88" rx="6" />
<text class="label" x="45" y="94">wb-hostd</text>
<text class="note" x="45" y="114">code: marks a fresh start,</text>
<text class="note" x="45" y="130">sends ActivePeriodStart,</text>
<text class="note" x="45" y="146">139 lines with tests</text>
<rect class="change-code" x="30" y="210" width="220" height="88" rx="6" />
<text class="label" x="45" y="234">wb-proxyd</text>
<text class="note" x="45" y="254">code: a fresh socket clears</text>
<text class="note" x="45" y="270">names, count and policy,</text>
<text class="note" x="45" y="286">301 lines with tests</text>
<rect class="change-code" x="470" y="210" width="220" height="88" rx="6" />
<text class="label" x="485" y="234">wb-netd</text>
<text class="note" x="485" y="254">code: refuses a fresh socket,</text>
<text class="note" x="485" y="270">shared contract, 91 lines,</text>
<text class="note" x="485" y="286">no period reset yet</text>
<rect class="box" x="30" y="350" width="200" height="88" rx="6" />
<text class="label" x="45" y="374">Xcode, runtimes</text>
<text class="note" x="45" y="394">the user's own, on the</text>
<text class="note" x="45" y="410">host, checked for Apple's</text>
<text class="note" x="45" y="426">signature</text>
<rect class="change-open" x="255" y="350" width="195" height="88" rx="6" />
<text class="label" x="270" y="374">wb-diskfmt-xcode</text>
<text class="note" x="270" y="394">open beside the train:</text>
<text class="note" x="270" y="410">builds xcode.img,</text>
<text class="note" x="270" y="426">spec only</text>
<rect class="change-code" x="475" y="350" width="215" height="88" rx="6" />
<text class="label" x="490" y="374">wb-vmd</text>
<text class="note" x="490" y="394">code: a layer slot for</text>
<text class="note" x="490" y="410">wb-vmd-layer refuses</text>
<text class="note" x="490" y="426">provisioning, 112 lines</text>
<rect class="box" x="745" y="210" width="225" height="88" rx="6" />
<text class="label" x="760" y="234">session VM</text>
<text class="note" x="760" y="254">unchanged: its packets</text>
<text class="note" x="760" y="270">go to wb-netd</text>
<rect class="change-open" x="745" y="350" width="225" height="88" rx="6" />
<text class="label" x="760" y="374">wb-guestd, build VM</text>
<text class="note" x="760" y="394">open beside the train: root</text>
<text class="note" x="760" y="410">installs Xcode and runtimes,</text>
<text class="note" x="760" y="426">no network device</text>
<path class="edge" d="M130,158 L130,208" marker-end="url(#w622-arrow)" />
<text class="note" x="142" y="181">fresh HandoffSocket,</text>
<text class="note" x="142" y="197">ActivePeriodStart</text>
<path class="edge" d="M230,114 L580,114 L580,208" marker-end="url(#w622-arrow)" />
<text class="note" x="262" y="105">HandoffSocket, fresh refused</text>
<path class="edge" d="M470,254 L252,254" marker-end="url(#w622-arrow)" />
<text class="note" x="272" y="245">hand-off socket, the old</text>
<text class="note" x="272" y="272">one closed under one lock</text>
<path class="edge" d="M745,254 L692,254" marker-end="url(#w622-arrow)" />
<path class="edge" d="M230,394 L253,394" marker-end="url(#w622-arrow)" />
<path class="edge" d="M450,394 L473,394" marker-end="url(#w622-arrow)" />
<path class="edge" d="M690,394 L743,394" marker-end="url(#w622-arrow)" />
<text class="note" x="300" y="458">xcode.img, attached read-only to the build VM</text>
<rect class="change-code" x="20" y="500" width="22" height="16" rx="3" />
<text class="note" x="50" y="513">code changed on the train</text>
<rect class="change-open" x="270" y="500" width="22" height="16" rx="3" />
<text class="note" x="300" y="513">designed, open beside the train</text>
<rect class="box" x="560" y="500" width="22" height="16" rx="3" />
<text class="note" x="590" y="513">unchanged, shown for context</text>
<path class="edge" d="M20,540 L42,540" marker-end="url(#w622-arrow)" />
<text class="note" x="50" y="545">a flow the changes touch</text>
</svg>
