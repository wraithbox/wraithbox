<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="A sequence of messages between wb-netd, wb-hostd and wb-proxyd for one hand-off socket number n. wb-hostd sends HandoffSocket to wb-proxyd, which answers HandoffSocketAck. wb-hostd then sends wb-netd its end, which answers HandoffSocketHeld, and the VM starts. wb-netd sends streams and name reports to wb-proxyd. wb-proxyd reports a socket it closed with HandoffSocketClosed, and at a VM stop answers HandoffSocketEnd with HandoffSocketEnded.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.lifeline { fill: none; stroke: #9a9996; stroke-width: 1; stroke-dasharray: 4 4; }
.arrow { fill: #5e5c64; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.edge { stroke: #c0bfbc; }
.lifeline { stroke: #77767b; }
.arrow { fill: #c0bfbc; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
}
</style>
<defs>
<marker id="s0720-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>
<rect class="box" x="70" y="20" width="160" height="44" rx="10" />
<text class="label" x="150" y="47" text-anchor="middle">wb-netd</text>
<rect class="box" x="370" y="20" width="160" height="44" rx="10" />
<text class="label" x="450" y="47" text-anchor="middle">wb-hostd</text>
<rect class="box" x="670" y="20" width="160" height="44" rx="10" />
<text class="label" x="750" y="47" text-anchor="middle">wb-proxyd</text>
<line class="lifeline" x1="150" y1="64" x2="150" y2="540" />
<line class="lifeline" x1="450" y1="64" x2="450" y2="540" />
<line class="lifeline" x1="750" y1="64" x2="750" y2="540" />

<line class="edge" x1="452" y1="100" x2="746" y2="100" marker-end="url(#s0720-arrow)" />
<text class="note" x="600" y="92" text-anchor="middle">1. HandoffSocket n, an end</text>
<line class="edge" x1="748" y1="140" x2="454" y2="140" marker-end="url(#s0720-arrow)" />
<text class="note" x="600" y="132" text-anchor="middle">2. HandoffSocketAck n</text>
<line class="edge" x1="448" y1="180" x2="154" y2="180" marker-end="url(#s0720-arrow)" />
<text class="note" x="300" y="172" text-anchor="middle">3. HandoffSocket n, the other end</text>
<line class="edge" x1="152" y1="220" x2="446" y2="220" marker-end="url(#s0720-arrow)" />
<text class="note" x="300" y="212" text-anchor="middle">4. HandoffSocketHeld n</text>
<text class="note" x="462" y="250">5. serving: the VM starts or resumes</text>
<line class="edge" x1="152" y1="290" x2="746" y2="290" marker-end="url(#s0720-arrow)" />
<text class="note" x="450" y="282" text-anchor="middle">streams and name reports, on socket n</text>
<line class="edge" x1="748" y1="350" x2="454" y2="350" marker-end="url(#s0720-arrow)" />
<text class="note" x="600" y="342" text-anchor="middle">HandoffSocketClosed n, rule</text>
<line class="edge" x1="448" y1="380" x2="154" y2="380" marker-end="url(#s0720-arrow)" />
<text class="note" x="300" y="372" text-anchor="middle">ends this VM's wb-netd</text>
<text class="note" x="462" y="420">or, at a VM stop:</text>
<line class="edge" x1="452" y1="460" x2="746" y2="460" marker-end="url(#s0720-arrow)" />
<text class="note" x="600" y="452" text-anchor="middle">HandoffSocketEnd n</text>
<line class="edge" x1="748" y1="500" x2="454" y2="500" marker-end="url(#s0720-arrow)" />
<text class="note" x="600" y="492" text-anchor="middle">HandoffSocketEnded n, after its counts</text>
</svg>
