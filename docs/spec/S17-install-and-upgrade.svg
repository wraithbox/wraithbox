<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="wb-hostd opens the files, then starts wb-download through wb-launcher. wb-download fetches Apple's catalog and a restore image, or a Claude Code release, over HTTPS into those descriptors. wb-hostd checks the restore image's hash, and wb-release-check checks the Claude Code release, before wb-vmd-install or wb-guestd uses them.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.guest { fill: #e8eef8; }
.boundary { fill: none; stroke: #c01c28; stroke-width: 2; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.arrow { fill: #5e5c64; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
.boundary-label { fill: #c01c28; font-size: 12.5px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.guest { fill: #2b3340; }
.boundary { stroke: #ff7b7b; }
.edge { stroke: #c0bfbc; }
.arrow { fill: #c0bfbc; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
.boundary-label { fill: #ff7b7b; }
}
</style>
<defs>
<marker id="f017-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>

<text class="note" x="20" y="24">host: runs as the user, no root</text>

<rect class="boundary" x="760" y="20" width="225" height="230" rx="12" />
<text class="boundary-label" x="772" y="40">internet, HTTPS only</text>
<rect class="box" x="775" y="55" width="195" height="72" rx="10" />
<text class="label" x="872" y="82" text-anchor="middle">Apple</text>
<text class="note" x="872" y="101" text-anchor="middle">mesu.apple.com</text>
<text class="note" x="872" y="117" text-anchor="middle">updates.cdn-apple.com</text>
<rect class="box" x="775" y="160" width="195" height="72" rx="10" />
<text class="label" x="872" y="187" text-anchor="middle">Anthropic</text>
<text class="note" x="872" y="206" text-anchor="middle">downloads.claude.ai</text>

<rect class="box" x="20" y="60" width="230" height="110" rx="10" />
<text class="label" x="135" y="86" text-anchor="middle">wb-hostd</text>
<text class="note" x="135" y="107" text-anchor="middle">no network</text>
<text class="note" x="135" y="126" text-anchor="middle">opens the files</text>
<text class="note" x="135" y="145" text-anchor="middle">checks size and SHA-1</text>

<rect class="box" x="290" y="60" width="180" height="60" rx="10" />
<text class="label" x="380" y="86" text-anchor="middle">wb-launcher</text>
<text class="note" x="380" y="105" text-anchor="middle">fixed entries</text>

<rect class="box" x="520" y="90" width="200" height="90" rx="10" />
<text class="label" x="620" y="116" text-anchor="middle">wb-download</text>
<text class="note" x="620" y="137" text-anchor="middle">one run, confined</text>
<text class="note" x="620" y="156" text-anchor="middle">hosts compiled in</text>

<line class="edge" x1="252" y1="90" x2="288" y2="90" marker-end="url(#f017-arrow)" />
<path class="edge" d="M472,90 C495,90 505,110 518,118" marker-end="url(#f017-arrow)" />
<text class="note" x="495" y="78" text-anchor="middle">starts</text>
<line class="edge" x1="722" y1="120" x2="773" y2="95" marker-end="url(#f017-arrow)" />
<line class="edge" x1="722" y1="160" x2="773" y2="192" marker-end="url(#f017-arrow)" />

<rect class="box" x="290" y="250" width="300" height="80" rx="10" />
<text class="label" x="440" y="276" text-anchor="middle">files in &lt;data&gt;</text>
<text class="note" x="440" y="297" text-anchor="middle">images/macos-restore.ipsw(.partial)</text>
<text class="note" x="440" y="315" text-anchor="middle">downloads/: a Claude Code release</text>

<path class="edge" d="M620,182 C620,215 560,235 545,248" marker-end="url(#f017-arrow)" />
<text class="note" x="605" y="215" text-anchor="end">writes to inherited descriptors</text>
<path class="edge" d="M150,172 C170,240 230,280 288,288" marker-end="url(#f017-arrow)" />
<text class="note" x="160" y="240">open, check, rename</text>

<rect class="box" x="20" y="370" width="230" height="64" rx="10" />
<text class="label" x="135" y="396" text-anchor="middle">wb-release-check</text>
<text class="note" x="135" y="415" text-anchor="middle">signature, version, SHA-256</text>
<line class="edge" x1="80" y1="172" x2="80" y2="368" marker-end="url(#f017-arrow)" />

<rect class="box" x="290" y="370" width="230" height="64" rx="10" />
<text class="label" x="405" y="396" text-anchor="middle">wb-vmd-install</text>
<text class="note" x="405" y="415" text-anchor="middle">reads the restore image</text>
<line class="edge" x1="405" y1="332" x2="405" y2="368" marker-end="url(#f017-arrow)" />

<rect class="boundary" x="290" y="460" width="695" height="90" rx="12" />
<text class="boundary-label" x="302" y="480">build guest: untrusted</text>
<rect class="box guest" x="600" y="475" width="250" height="60" rx="10" />
<text class="label" x="725" y="500" text-anchor="middle">wb-guestd</text>
<text class="note" x="725" y="520" text-anchor="middle">installs the checked binary</text>
<path class="edge" d="M250,160 L268,160 L268,505 L598,505" marker-end="url(#f017-arrow)" />
<text class="note" x="302" y="530">the checked bytes, over the host-guest socket</text>
</svg>
