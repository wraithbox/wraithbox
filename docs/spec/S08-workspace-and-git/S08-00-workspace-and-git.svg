<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="The git round trip. wb fetches the selected refs from your repository into export.git. The guest's git-remote-wb reaches only wb-hostd, through wb-guestd. wb-hostd serves export.git read-only, and passes pushes through the ref filter and the pack scanner into landing.git, which borrows objects from export.git. wb land fetches from landing.git into your repository. A fetch by ID from your repository and a push to main are stopped.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.guest { fill: #e8eef8; }
.boundary { fill: none; stroke: #c01c28; stroke-width: 2; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.edge-bad { fill: none; stroke: #c01c28; stroke-width: 1.5; stroke-dasharray: 3 3; }
.arrow { fill: #5e5c64; }
.arrow-bad { fill: #c01c28; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
.boundary-label { fill: #c01c28; font-size: 12.5px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.guest { fill: #2b3340; }
.boundary { stroke: #ff7b7b; }
.edge { stroke: #c0bfbc; }
.edge-bad { stroke: #ff7b7b; }
.arrow { fill: #c0bfbc; }
.arrow-bad { fill: #ff7b7b; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
.boundary-label { fill: #ff7b7b; }
}
</style>
<defs>
<marker id="f008-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
<marker id="f008-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-bad" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>
<text class="note" x="20" y="18">host: trusted</text>
<rect class="box" x="60" y="30" width="190" height="60" rx="10" />
<text class="label" x="155" y="56" text-anchor="middle">your repository</text>
<text class="note" x="155" y="76" text-anchor="middle">all branches, tags, stash</text>
<rect class="box" x="60" y="160" width="190" height="60" rx="10" />
<text class="label" x="155" y="186" text-anchor="middle">export.git</text>
<text class="note" x="155" y="206" text-anchor="middle">selected refs · written by wb</text>
<rect class="box" x="60" y="300" width="190" height="60" rx="10" />
<text class="label" x="155" y="326" text-anchor="middle">landing.git</text>
<text class="note" x="155" y="346" text-anchor="middle">wb/&lt;session&gt;/* only</text>
<line class="edge" x1="155" y1="92" x2="155" y2="158" marker-end="url(#f008-arrow)" />
<text class="note" x="162" y="130">wb: export update</text>
<path class="edge" d="M58,330 C10,280 10,120 58,62" marker-end="url(#f008-arrow)" />
<text class="note" x="14" y="250" transform="rotate(-90 14 250)">wb land</text>
<path class="edge" d="M210,298 C230,270 230,250 210,222" marker-end="url(#f008-arrow)" />
<text class="note" x="232" y="264">borrows</text>
<rect class="box" x="300" y="150" width="220" height="220" rx="10" />
<text class="label" x="410" y="176" text-anchor="middle">wb-hostd</text>
<text class="note" x="410" y="204" text-anchor="middle">upload-pack, read-only</text>
<text class="note" x="410" y="276" text-anchor="middle">ref filter</text>
<text class="note" x="410" y="296" text-anchor="middle">pack scanner</text>
<text class="note" x="410" y="316" text-anchor="middle">receive-pack, strict fsck</text>
<text class="note" x="410" y="336" text-anchor="middle">pre-receive check</text>
<line class="edge" x1="252" y1="196" x2="298" y2="200" marker-end="url(#f008-arrow)" />
<line class="edge" x1="298" y1="320" x2="252" y2="328" marker-end="url(#f008-arrow)" />
<rect class="boundary" x="560" y="20" width="230" height="360" rx="12" />
<text class="boundary-label" x="572" y="40">guest: untrusted</text>
<rect class="box guest" x="590" y="160" width="180" height="60" rx="10" />
<text class="label" x="680" y="186" text-anchor="middle">wb-guestd</text>
<text class="note" x="680" y="206" text-anchor="middle">host-guest socket</text>
<rect class="box guest" x="590" y="280" width="180" height="60" rx="10" />
<text class="label" x="680" y="306" text-anchor="middle">git-remote-wb</text>
<text class="note" x="680" y="326" text-anchor="middle">clone, fetch, push</text>
<line class="edge" x1="680" y1="278" x2="680" y2="222" marker-end="url(#f008-arrow)" marker-start="url(#f008-arrow)" />
<line class="edge" x1="588" y1="190" x2="522" y2="220" marker-end="url(#f008-arrow)" marker-start="url(#f008-arrow)" />
<path class="edge-bad" d="M640,158 C600,60 400,50 252,58" marker-end="url(#f008-arrow-bad)" />
<text class="boundary-label" x="420" y="44" text-anchor="middle">fetch by ID: not in export.git</text>
<path class="edge-bad" d="M588,326 C560,326 550,276 524,274" marker-end="url(#f008-arrow-bad)" />
<text class="boundary-label" x="470" y="392" text-anchor="middle">push to main: stops at the ref filter</text>
</svg>
