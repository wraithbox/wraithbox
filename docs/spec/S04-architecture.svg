<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="Wraith Box processes on the host and in the guest, including wb-guestadmin, which only writes to its own host-guest connection. Two channels cross the VM boundary: the host-guest socket to wb-hostd and Ethernet frames to wb-netd.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.guest { fill: #e8eef8; }
.boundary { fill: none; stroke: #c01c28; stroke-width: 2; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.arrow { fill: #5e5c64; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
.boundary-label { fill: #c01c28; font-size: 12.5px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.guest { fill: #2b3340; }
.boundary { stroke: #ff7b7b; }
.edge { stroke: #c0bfbc; }
.arrow { fill: #c0bfbc; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
.boundary-label { fill: #ff7b7b; }
}
</style>
<defs>
<marker id="f004-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>
<text class="note" x="300" y="34">host: trusted, runs as the user, no root</text>
<rect class="box" x="20" y="20" width="230" height="44" rx="10" />
<text class="label" x="135" y="47" text-anchor="middle">terminal: wb claude …</text>
<line class="edge" x1="135" y1="64" x2="135" y2="98" marker-end="url(#f004-arrow)" />
<rect class="box" x="20" y="100" width="230" height="64" rx="10" />
<text class="label" x="135" y="126" text-anchor="middle">wb</text>
<text class="note" x="135" y="147" text-anchor="middle">the only CLI · TTY relay</text>
<line class="edge" x1="252" y1="132" x2="298" y2="132" marker-end="url(#f004-arrow)" />
<text class="note" x="275" y="122" text-anchor="middle">gRPC</text>
<rect class="box" x="300" y="80" width="260" height="104" rx="10" />
<text class="label" x="430" y="106" text-anchor="middle">wb-hostd</text>
<text class="note" x="430" y="128" text-anchor="middle">sessions · git gateway</text>
<text class="note" x="430" y="147" text-anchor="middle">policy store · approvals</text>
<text class="note" x="430" y="166" text-anchor="middle">audit log · VM admission</text>
<line class="edge" x1="320" y1="186" x2="215" y2="238" marker-end="url(#f004-arrow)" />
<text class="note" x="290" y="222" text-anchor="middle">gRPC</text>
<rect class="box" x="20" y="240" width="230" height="110" rx="10" />
<text class="label" x="135" y="266" text-anchor="middle">wb-vmd</text>
<text class="note" x="135" y="288" text-anchor="middle">platform-native VM provider</text>
<text class="note" x="135" y="307" text-anchor="middle">macOS: Swift, Virtualization</text>
<text class="note" x="135" y="326" text-anchor="middle">no policy · build password only</text>
<line class="edge" x1="252" y1="295" x2="538" y2="295" marker-end="url(#f004-arrow)" />
<text class="note" x="395" y="287" text-anchor="middle">NIC descriptor</text>
<line class="edge" x1="135" y1="352" x2="135" y2="398" marker-end="url(#f004-arrow)" />
<text class="note" x="145" y="380">starts and stops VMs</text>
<rect class="box" x="540" y="240" width="200" height="110" rx="10" />
<text class="label" x="640" y="266" text-anchor="middle">wb-netd</text>
<text class="note" x="640" y="288" text-anchor="middle">userspace TCP/IP (gVisor)</text>
<text class="note" x="640" y="307" text-anchor="middle">DHCP · DNS</text>
<text class="note" x="640" y="326" text-anchor="middle">no secrets · no outbound</text>
<line class="edge" x1="742" y1="295" x2="788" y2="295" marker-end="url(#f004-arrow)" />
<text class="note" x="765" y="285" text-anchor="middle">streams</text>
<rect class="box" x="790" y="240" width="190" height="110" rx="10" />
<text class="label" x="885" y="266" text-anchor="middle">wb-proxyd</text>
<text class="note" x="885" y="288" text-anchor="middle">HTTP policy</text>
<text class="note" x="885" y="307" text-anchor="middle">credential replacement</text>
<text class="note" x="885" y="326" text-anchor="middle">dependency gate</text>
<text class="note" x="885" y="345" text-anchor="middle">fetches what it injects</text>
<line class="edge" x1="885" y1="238" x2="885" y2="156" marker-end="url(#f004-arrow)" />
<text class="note" x="895" y="202">allowlisted only</text>
<rect class="box" x="580" y="70" width="190" height="104" rx="10" />
<text class="label" x="675" y="96" text-anchor="middle">wb-guestadmin</text>
<text class="note" x="675" y="117" text-anchor="middle">wbadmin passwords only</text>
<text class="note" x="675" y="136" text-anchor="middle">one build, rotation or</text>
<text class="note" x="675" y="155" text-anchor="middle">break-glass, then exits</text>
<polyline class="edge" points="600,176 600,215 530,215 530,432" marker-end="url(#f004-arrow)" />
<text class="note" x="608" y="208">write-only</text>
<rect class="box" x="790" y="100" width="190" height="54" rx="10" />
<text class="label" x="885" y="132" text-anchor="middle">Internet</text>
<rect class="boundary" x="10" y="400" width="710" height="236" rx="14" />
<text class="boundary-label" x="22" y="420">work VM: guest, untrusted (v1: macOS)</text>
<rect class="box guest" x="300" y="436" width="240" height="46" rx="10" />
<text class="label" x="420" y="464" text-anchor="middle">host-guest socket</text>
<line class="edge" x1="420" y1="434" x2="420" y2="188" marker-end="url(#f004-arrow)" />
<rect class="box guest" x="560" y="436" width="140" height="46" rx="10" />
<text class="label" x="630" y="464" text-anchor="middle">virtual NIC</text>
<line class="edge" x1="630" y1="434" x2="630" y2="352" marker-end="url(#f004-arrow)" />
<text class="boundary-label" x="412" y="392" text-anchor="end">crosses: socket (vsock)</text>
<text class="boundary-label" x="640" y="392">crosses: frames</text>
<rect class="box guest" x="30" y="436" width="240" height="46" rx="10" />
<text class="label" x="150" y="464" text-anchor="middle">wb-guestd (root)</text>
<line class="edge" x1="272" y1="459" x2="298" y2="459" marker-start="url(#f004-arrow)" marker-end="url(#f004-arrow)" />
<rect class="box guest" x="30" y="504" width="200" height="86" rx="10" />
<text class="label" x="130" y="530" text-anchor="middle">project user A</text>
<text class="note" x="130" y="552" text-anchor="middle">clone + worktrees</text>
<text class="note" x="130" y="571" text-anchor="middle">claude · tools</text>
<rect class="box guest" x="250" y="504" width="200" height="86" rx="10" />
<text class="label" x="350" y="530" text-anchor="middle">project user B</text>
<text class="note" x="350" y="552" text-anchor="middle">clone + worktrees</text>
<text class="note" x="350" y="571" text-anchor="middle">claude · tools</text>
<text class="note" x="470" y="530">no secrets</text>
<text class="note" x="470" y="550">no host mounts</text>
<text class="note" x="470" y="570">no other devices</text>
<text class="note" x="30" y="620">wb-guestd starts every process as a project user; each project has its own user.</text>
<rect class="boundary" x="740" y="400" width="250" height="236" rx="14" />
<text class="boundary-label" x="752" y="420">isolated VM (optional)</text>
<text class="note" x="865" y="480" text-anchor="middle">same wiring, own policy</text>
<text class="note" x="865" y="505" text-anchor="middle">isolated projects, --isolated</text>
<text class="note" x="865" y="530" text-anchor="middle">work needing a GUI login</text>
</svg>
