<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Claude Code in the guest. wb reads an allowlist of the user's ~/.claude/, filters and scans it, and wb-hostd hands the copy to wb-guestd, which writes it as the project user. ~/.claude.json never reaches the guest. The download program fetches a Claude Code build on the host, wb-release-check checks it for wb-hostd, and wb-guestd installs it root-owned during the image build. Claude Code reaches Anthropic only through wb-proxyd, which injects the model credential.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.guest { fill: #e8eef8; }
.boundary { fill: none; stroke: #c01c28; stroke-width: 2; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.edge-bad { fill: none; stroke: #c01c28; stroke-width: 1.5; stroke-dasharray: 3 3; }
.arrow { fill: #5e5c64; }
.arrow-bad { fill: #c01c28; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
.boundary-label { fill: #c01c28; font-size: 12.5px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.guest { fill: #2b3340; }
.boundary { stroke: #ff7b7b; }
.edge { stroke: #c0bfbc; }
.edge-bad { stroke: #ff7b7b; }
.arrow { fill: #c0bfbc; }
.arrow-bad { fill: #ff7b7b; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
.boundary-label { fill: #ff7b7b; }
}
</style>
<defs>
<marker id="f014-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
<marker id="f014-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-bad" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>

<text class="note" x="20" y="20">host: trusted</text>

<rect class="box host" x="20" y="40" width="220" height="80" rx="10" />
<text class="label" x="130" y="66" text-anchor="middle">~/.claude/</text>
<text class="note" x="130" y="86" text-anchor="middle">CLAUDE.md, agents, skills,</text>
<text class="note" x="130" y="103" text-anchor="middle">commands, settings.json</text>

<rect class="box host" x="20" y="160" width="220" height="60" rx="10" />
<text class="label" x="130" y="186" text-anchor="middle">~/.claude.json</text>
<text class="note" x="130" y="205" text-anchor="middle">sign-in, MCP servers</text>

<rect class="box host" x="20" y="280" width="220" height="70" rx="10" />
<text class="label" x="130" y="306" text-anchor="middle">download program</text>
<text class="note" x="130" y="326" text-anchor="middle">fetches a Claude Code build</text>

<rect class="box" x="20" y="410" width="220" height="70" rx="10" />
<text class="label" x="130" y="436" text-anchor="middle">Anthropic</text>
<text class="note" x="130" y="456" text-anchor="middle">model API, downloads</text>

<rect class="box host" x="300" y="40" width="200" height="80" rx="10" />
<text class="label" x="400" y="66" text-anchor="middle">wb</text>
<text class="note" x="400" y="86" text-anchor="middle">allowlist, filter,</text>
<text class="note" x="400" y="103" text-anchor="middle">secret scan</text>

<rect class="box host" x="300" y="200" width="200" height="80" rx="10" />
<text class="label" x="400" y="226" text-anchor="middle">wb-hostd</text>
<text class="note" x="400" y="246" text-anchor="middle">has the build checked</text>
<text class="note" x="400" y="263" text-anchor="middle">by wb-release-check</text>

<rect class="box host" x="300" y="400" width="200" height="80" rx="10" />
<text class="label" x="400" y="426" text-anchor="middle">wb-proxyd</text>
<text class="note" x="400" y="446" text-anchor="middle">model API profile,</text>
<text class="note" x="400" y="463" text-anchor="middle">injects the credential</text>

<rect class="boundary" x="560" y="20" width="420" height="480" rx="14" />
<text class="boundary-label" x="574" y="42">guest VM: untrusted</text>

<rect class="box guest" x="590" y="200" width="170" height="80" rx="10" />
<text class="label" x="675" y="226" text-anchor="middle">wb-guestd</text>
<text class="note" x="675" y="246" text-anchor="middle">installs as root,</text>
<text class="note" x="675" y="263" text-anchor="middle">copies as the user</text>

<rect class="box guest" x="790" y="60" width="170" height="80" rx="10" />
<text class="label" x="875" y="86" text-anchor="middle">project user</text>
<text class="note" x="875" y="106" text-anchor="middle">~/.claude/ copy</text>

<rect class="box guest" x="790" y="340" width="170" height="90" rx="10" />
<text class="label" x="875" y="366" text-anchor="middle">Claude Code</text>
<text class="note" x="875" y="386" text-anchor="middle">root-owned, set by</text>
<text class="note" x="875" y="403" text-anchor="middle">the image, updates off</text>

<line class="edge" x1="242" y1="80" x2="298" y2="80" marker-end="url(#f014-arrow)" />
<line class="edge" x1="400" y1="122" x2="400" y2="198" marker-end="url(#f014-arrow)" />
<line class="edge" x1="502" y1="240" x2="588" y2="240" marker-end="url(#f014-arrow)" />
<line class="edge" x1="740" y1="198" x2="810" y2="142" marker-end="url(#f014-arrow)" />
<line class="edge" x1="740" y1="282" x2="810" y2="338" marker-end="url(#f014-arrow)" />
<line class="edge" x1="875" y1="142" x2="875" y2="338" marker-end="url(#f014-arrow)" />
<line class="edge" x1="130" y1="408" x2="130" y2="352" marker-end="url(#f014-arrow)" />
<line class="edge" x1="242" y1="300" x2="298" y2="260" marker-end="url(#f014-arrow)" />
<line class="edge" x1="788" y1="400" x2="502" y2="440" marker-end="url(#f014-arrow)" />
<text class="note" x="600" y="440">via wb-netd</text>
<line class="edge" x1="298" y1="445" x2="242" y2="445" marker-end="url(#f014-arrow)" />

<path class="edge-bad" d="M242,190 C380,160 520,150 788,110" marker-end="url(#f014-arrow-bad)" />
<text class="boundary-label" x="520" y="170">never</text>
</svg>
