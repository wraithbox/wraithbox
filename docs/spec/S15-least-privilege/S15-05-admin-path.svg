<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="The admin path next to the agent paths. wb vm admin reaches wb-guestroot in the guest through a service and a guest port of its own. The agent paths reach wb-guestd. No guest process reaches wb-guestroot.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.guest { fill: #e8eef8; }
.boundary { fill: none; stroke: #c01c28; stroke-width: 2; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.edge-bad { fill: none; stroke: #c01c28; stroke-width: 1.5; stroke-dasharray: 3 3; }
.arrow { fill: #5e5c64; }
.arrow-bad { fill: #c01c28; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
.boundary-label { fill: #c01c28; font-size: 12.5px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.guest { fill: #2b3340; }
.boundary { stroke: #ff7b7b; }
.edge { stroke: #c0bfbc; }
.edge-bad { stroke: #ff7b7b; }
.arrow { fill: #c0bfbc; }
.arrow-bad { fill: #ff7b7b; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
.boundary-label { fill: #ff7b7b; }
}
</style>
<defs>
<marker id="s1505-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
<marker id="s1505-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-bad" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>

<rect class="box host" x="30" y="70" width="200" height="80" rx="10" />
<text class="label" x="130" y="98" text-anchor="middle">wb vm admin</text>
<text class="note" x="130" y="118" text-anchor="middle">a person, in its own</text>
<text class="note" x="130" y="135" text-anchor="middle">terminal, types the VM</text>

<rect class="box host" x="30" y="300" width="200" height="80" rx="10" />
<text class="label" x="130" y="328" text-anchor="middle">wb claude, wb shell</text>
<text class="note" x="130" y="348" text-anchor="middle">agent sessions and</text>
<text class="note" x="130" y="365" text-anchor="middle">debug shells</text>

<rect class="box host" x="290" y="60" width="230" height="330" rx="10" />
<text class="label" x="405" y="88" text-anchor="middle">wb-hostd</text>
<text class="note" x="405" y="112" text-anchor="middle">admin service and handler</text>
<text class="note" x="405" y="130" text-anchor="middle">marks the system disk</text>
<text class="note" x="405" y="148" text-anchor="middle">first, writes 5019 events</text>
<text class="note" x="405" y="230" text-anchor="middle">both through wb-vmd,</text>
<text class="note" x="405" y="248" text-anchor="middle">routed on the guest port</text>
<text class="note" x="405" y="330" text-anchor="middle">ShellService, sessions</text>
<text class="note" x="405" y="348" text-anchor="middle">refused on a marked disk</text>

<rect class="boundary" x="580" y="30" width="400" height="470" rx="14" />
<text class="boundary-label" x="594" y="52">VM, untrusted</text>

<rect class="box guest" x="620" y="70" width="210" height="80" rx="10" />
<text class="label" x="725" y="98" text-anchor="middle">wb-guestroot</text>
<text class="note" x="725" y="118" text-anchor="middle">root daemon, own port</text>
<text class="note" x="725" y="135" text-anchor="middle">zsh as root on a PTY</text>

<rect class="box guest" x="620" y="300" width="210" height="80" rx="10" />
<text class="label" x="725" y="328" text-anchor="middle">wb-guestd</text>
<text class="note" x="725" y="348" text-anchor="middle">root daemon, port 1023</text>
<text class="note" x="725" y="365" text-anchor="middle">users, sessions, git</text>

<rect class="box guest" x="620" y="420" width="210" height="56" rx="10" />
<text class="label" x="725" y="446" text-anchor="middle">project user</text>
<text class="note" x="725" y="464" text-anchor="middle">agent processes</text>

<line class="edge" x1="230" y1="110" x2="288" y2="110" marker-end="url(#s1505-arrow)" />
<line class="edge" x1="230" y1="340" x2="288" y2="340" marker-end="url(#s1505-arrow)" />
<line class="edge" x1="520" y1="110" x2="618" y2="110" marker-end="url(#s1505-arrow)" />
<text class="note" x="528" y="100">admin port</text>
<line class="edge" x1="520" y1="340" x2="618" y2="340" marker-end="url(#s1505-arrow)" />
<text class="note" x="528" y="330">port 1023</text>

<line class="edge-bad" x1="700" y1="298" x2="700" y2="152" marker-end="url(#s1505-arrow-bad)" />
<text class="note" x="708" y="230">no call</text>
<path class="edge-bad" d="M830,448 C930,448 930,110 832,110" marker-end="url(#s1505-arrow-bad)" />
<text class="note" x="860" y="260">can't bind</text>
<text class="note" x="860" y="277">or open it</text>
</svg>
