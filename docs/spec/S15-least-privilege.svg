<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="The secret store outside the Wraith Box processes, with an arrow for each declared access and each path a secret takes to a consumer.">
<style>
svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
.box { fill: #ffffff; stroke: #77767b; stroke-width: 1.5; }
.guest { fill: #e8eef8; }
.boundary { fill: none; stroke: #c01c28; stroke-width: 2; stroke-dasharray: 6 4; }
.edge { fill: none; stroke: #5e5c64; stroke-width: 1.5; }
.edge-bad { fill: none; stroke: #c01c28; stroke-width: 1.5; stroke-dasharray: 3 3; }
.arrow { fill: #5e5c64; }
.arrow-bad { fill: #c01c28; }
.label { fill: #242428; font-weight: 600; }
.note { fill: #5e5c64; font-size: 12.5px; }
.boundary-label { fill: #c01c28; font-size: 12.5px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
.box { fill: #343437; stroke: #9a9996; }
.guest { fill: #2b3340; }
.boundary { stroke: #ff7b7b; }
.edge { stroke: #c0bfbc; }
.edge-bad { stroke: #ff7b7b; }
.arrow { fill: #c0bfbc; }
.arrow-bad { fill: #ff7b7b; }
.label { fill: #ffffff; }
.note { fill: #c0bfbc; }
.boundary-label { fill: #ff7b7b; }
}
</style>
<defs>
<marker id="f015-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z" /></marker>
<marker id="f015-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-bad" d="M0,0 L10,5 L0,10 z" /></marker>
</defs>

<rect class="box host" x="20" y="230" width="200" height="110" rx="10" />
<text class="label" x="120" y="258" text-anchor="middle">secret store</text>
<text class="note" x="120" y="280" text-anchor="middle">nominal holder</text>
<text class="note" x="120" y="298" text-anchor="middle">Wraith Box keychain,</text>
<text class="note" x="120" y="315" text-anchor="middle">later a 1Password vault</text>

<rect class="boundary" x="260" y="30" width="460" height="540" rx="14" />
<text class="boundary-label" x="274" y="52">Wraith Box processes, as the user</text>

<rect class="box host" x="280" y="70" width="180" height="56" rx="10" />
<text class="label" x="370" y="95" text-anchor="middle">wb</text>
<text class="note" x="370" y="114" text-anchor="middle">the CLI: cred set</text>

<rect class="box host" x="500" y="70" width="200" height="74" rx="10" />
<text class="label" x="600" y="95" text-anchor="middle">wb-proxyd</text>
<text class="note" x="600" y="114" text-anchor="middle">only what proxying</text>
<text class="note" x="600" y="131" text-anchor="middle">needs, just in time</text>

<rect class="box host" x="280" y="200" width="180" height="90" rx="10" />
<text class="label" x="370" y="226" text-anchor="middle">wb-hostd</text>
<text class="note" x="370" y="247" text-anchor="middle">no store access</text>
<text class="note" x="370" y="264" text-anchor="middle">passes descriptors,</text>
<text class="note" x="370" y="280" text-anchor="middle">reads none</text>

<rect class="box host" x="500" y="200" width="200" height="90" rx="10" />
<text class="label" x="600" y="226" text-anchor="middle">wb-guestadmin</text>
<text class="note" x="600" y="247" text-anchor="middle">one build or rotation</text>
<text class="note" x="600" y="264" text-anchor="middle">generates wbadmin</text>
<text class="note" x="600" y="280" text-anchor="middle">passwords</text>

<rect class="box host" x="280" y="470" width="180" height="76" rx="10" />
<text class="label" x="370" y="496" text-anchor="middle">wb-vmd (build)</text>
<text class="note" x="370" y="516" text-anchor="middle">until the start</text>
<text class="note" x="370" y="532" text-anchor="middle">call returns</text>

<rect class="box host" x="500" y="470" width="200" height="76" rx="10" />
<text class="label" x="600" y="496" text-anchor="middle">ssh (build)</text>
<text class="note" x="600" y="516" text-anchor="middle">one session (I139)</text>
<text class="note" x="600" y="532" text-anchor="middle">stdin to sudo</text>

<path class="edge" d="M280,100 C230,110 180,170 150,228" marker-end="url(#f015-arrow)" />
<text class="note" x="160" y="150">write</text>
<path class="edge" d="M120,228 C120,20 560,10 580,68" marker-end="url(#f015-arrow)" />
<text class="note" x="290" y="22">fetch: bindings · use: CA key</text>
<polyline class="edge" points="222,330 580,330 600,292" marker-start="url(#f015-arrow)" marker-end="url(#f015-arrow)" />
<text class="note" x="236" y="352">write, fetch: wbadmin items</text>

<line class="edge" x1="520" y1="292" x2="400" y2="468" marker-end="url(#f015-arrow)" />
<text class="note" x="440" y="455">pipe</text>
<line class="edge" x1="660" y1="292" x2="660" y2="468" marker-end="url(#f015-arrow)" />
<text class="note" x="668" y="455">pipe</text>

<rect class="box host" x="770" y="40" width="210" height="66" rx="10" />
<text class="label" x="875" y="64" text-anchor="middle">upstream host</text>
<text class="note" x="875" y="83" text-anchor="middle">the binding's hosts,</text>
<text class="note" x="875" y="99" text-anchor="middle">per request, over TLS</text>
<line class="edge" x1="702" y1="90" x2="768" y2="78" marker-end="url(#f015-arrow)" />

<rect class="boundary" x="745" y="125" width="245" height="100" rx="14" />
<text class="boundary-label" x="757" y="145">VM running project code</text>
<rect class="box guest" x="770" y="155" width="210" height="56" rx="10" />
<text class="label" x="875" y="179" text-anchor="middle">guest</text>
<text class="note" x="875" y="198" text-anchor="middle">placeholders only</text>
<line class="edge-bad" x1="702" y1="130" x2="768" y2="175" marker-end="url(#f015-arrow-bad)" />

<rect class="boundary" x="745" y="250" width="245" height="320" rx="14" />
<text class="boundary-label" x="757" y="270">build VM or fresh clone</text>
<text class="note" x="757" y="287">no project code yet</text>
<rect class="box guest" x="770" y="300" width="210" height="70" rx="10" />
<text class="label" x="875" y="326" text-anchor="middle">wbadmin</text>
<text class="note" x="875" y="347" text-anchor="middle">host-administered</text>
<rect class="box guest" x="770" y="420" width="210" height="96" rx="10" />
<text class="label" x="875" y="446" text-anchor="middle">wb-guestd</text>
<text class="note" x="875" y="467" text-anchor="middle">first contact: old and</text>
<text class="note" x="875" y="484" text-anchor="middle">new password on its</text>
<text class="note" x="875" y="500" text-anchor="middle">own connection</text>
<line class="edge" x1="875" y1="418" x2="875" y2="372" marker-end="url(#f015-arrow)" />
<path class="edge" d="M702,250 C740,300 730,420 768,450" marker-end="url(#f015-arrow)" />
<path class="edge" d="M462,480 C560,430 700,380 768,345" marker-end="url(#f015-arrow)" />
<line class="edge" x1="702" y1="500" x2="768" y2="360" marker-end="url(#f015-arrow)" />
</svg>
