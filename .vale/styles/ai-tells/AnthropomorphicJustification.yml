---
extends: existence
message: "AI cliché: '%s'. Say what you mean directly."
level: error
ignorecase: true
tokens:
  # Handing: an inanimate subject passes something to another as though
  # across a counter ("the guard hands the merge a clean start"). Drafted
  # from rejected commit messages and measured at zero matches across the
  # Go and Python standard libraries.
  - (?:a|an|the|this|that|these|those|its|their|both|all|every|each)\s+\w+\s+hands?\s+(?:the|a|it|them)\b

  # Candidate not yet implemented: the occupational metaphor with no
  # possessive anchor. Every idiom in the paying family gates itself on
  # "its" or "itself" ("pays its rent", "pays for itself"), which is what
  # keeps a person out of the subject slot; FigurativeEarns gave up that
  # protection deliberately, on a corpus that never uses its verb.
  # "Negates for a living" carries no such anchor and no such corpus
  # silence, so a bare token would flag "she writes for a living" too,
  # and that is ordinary English about a person with a job.
  #
  # Measured at zero across the Go and Python standard libraries, the
  # markdown in the Go source tree, and this project's accepted commit
  # history. That silence cuts both ways: it leaves the person-subject false
  # positive unmeasured, so the gating problem has to be solved on other
  # evidence before a token lands.

  # "Paying" family
  - pays?\sfor\sitself
  - pays?\sdividends
  - pays?\sits\srent
  - more\sthan\spays?\sfor\sitself
  - paid\sfor\sitself
  - paid\sdividends
  - paid\sits\srent
  - paying\sfor\sitself
  - paying\sdividends
  - paying\sits\srent

  # "Weight" family
  - pulls?\sits\sweight
  - carries?\sits\sweight
  - carrying\sits\sweight
  - pulling\sits\sweight
  - punche?s?\sabove\sits\sweight
  - punching\sabove\sits\sweight

  # "Lifting" family
  - does?\sthe\sheavy\slifting
  - does?\sa\slot\sof\sheavy\slifting
  - doing\sthe\sheavy\slifting
  - doing\sa\slot\sof\sheavy\slifting
  - does?\sthe\slegwork
  - doing\sthe\slegwork
  - do\sthe\sheavy\slifting

  # "Load-bearing" / "doing work" family.
  - load-bearing
  - load\sbearing
  - does?\sthe\swork
  - doing\sthe\swork
  - does?\sthe\sreal\swork
  - doing\sthe\sreal\swork
  - does?\sthe\sactual\swork
  - doing\sthe\sactual\swork
  - does?\sthe\shard\swork
  - doing\sthe\shard\swork
  - does?\sthe\simportant\swork
  - doing\sthe\simportant\swork
  - does?\smost\sof\sthe\swork
  - doing\smost\sof\sthe\swork

  # "Standing" family.
  # Across the seven pre-LLM corpora (Go blog, Go proposals, Go stdlib,
  # PEPs, Pro Git, Python stdlib, Rust RFCs) "stand on its own" and
  # "stand on their own" match four times, each the self-sufficient
  # sense: the Go stdlib's "the deprecation message should be able to
  # stand on its own" and a PEP's "The changes in this PEP stand on
  # their own merits." The verb phrase "stand alone" matches another
  # four (a PEP's "the final PEP text stands alone with all required
  # information," a Rust RFC's "the tuple notation stands alone"). The
  # one adjective use, the Python stdlib's "a stand alone top-level
  # window," is what the lookbehind on the bare-verb token excludes.
  # "Stand by itself," "hold up on its own," "speak for themselves," and
  # "carry" or "pull its own weight" match nowhere.
  - stands?\son\sits\sown
  - standing\son\sits\sown
  - stands\salone
  - standing\salone
  - stood\salone
  - "(?<!\\b(?:a|an|the|any|each|every|one|this|that)\\s)stand\\salone\\b"
  - stands?\sby\s(?:itself|themselves)
  - standing\sby\s(?:itself|themselves)
  - stood\sby\s(?:itself|themselves)
  - stands?\son\stheir\sown
  - standing\son\stheir\sown
  - stood\son\s(?:its|their)\sown
  - holds?\sits\sown
  - holding\sits\sown
  - holds?\sup\son\s(?:its|their)\sown
  - holding\sup\son\s(?:its|their)\sown
  - held\sup\son\s(?:its|their)\sown
  - speaks?\sfor\sitself
  - speaking\sfor\sitself
  - speaks?\sfor\sthemselves
  - speaking\sfor\sthemselves
  - carr(?:ies|y|ied|ying)\s(?:its|their)\sown\sweight
  - pull(?:s|ed|ing)?\s(?:its|their)\sown\sweight
  - justifies?\sits\sexistence
  - justify\sits\sexistence
  - justifying\sits\sexistence

  # "Deserving" family.
  # Treats abstractions and inanimate subjects as moral agents owed
  # consideration. The gerund form ("deserves noting", "deserves
  # exploring") is the strongest AI tell — the older idiomatic
  # phrases ("deserves a closer look", "deserves mention") are
  # included for completeness.
  - deserves?\sattention
  - deserves?\smention
  - deserves?\smentioning
  - deserves?\snoting
  - deserves?\sexploring
  - deserves?\sunpacking
  - deserves?\sexamining
  - deserves?\sscrutiny
  - deserves?\sconsideration
  - deserves?\scareful\sconsideration
  - deserves?\scareful\sthought
  - deserves?\scareful\sattention
  - deserves?\sa\scloser\slook
  - deserves?\sa\ssecond\slook
  - deserves?\sa\smoment
  - deserves?\sa\smention
  - deserves?\scredit
  - deserves?\sconfirming
  - deserves?\schecking
  - deserves?\srethinking
  - deserves?\srevisiting

  # "Crowning" family.
  # Coronation applied to artifacts: a commit "crowns the release," a
  # benchmark win is "the crowning achievement." Royalty and dental
  # prose have the literal senses; disable the rule there.
  - crown(?:s|ed)?\s(?:a|an|the|its)
  - crowning\s(?:achievement|glory|jewel|touch|moment)

  # "Claiming" family.
  # The artifact competes for rank ("claims the top spot," "claims
  # pride of place"). Gated on the trophy object, so a paper that
  # claims a result stays clean.
  - claims?\s(?:the|its|a)\s(?:top\s|first\s|second\s|third\s)?(?:spot|place|billing|title|crown|throne|mantle|prize|lead|podium)
  - claims?\s(?:pride\sof\splace|cent(?:er|re)\sstage)
  - stake(?:s|d)?\s(?:a|its|out\sa)\sclaim

  # "Agency" family.
  # Verbs of intention or feeling applied to artifacts: code that
  # "behaves itself," docs that "pretend otherwise," a linter that
  # "cares deeply," a README that "delivers on its promise," a design
  # that "hangs on a single assumption."
  - behaves?\sitself
  - behaving\sitself
  - on\sits\sbest\sbehavior
  - on\sits\sbest\sbehaviour
  # Reflexive agency: an operation performs a deliberate act on itself
  # ("the query narrows itself," "the config tunes itself"). The
  # self-directed verb is the tell. "Sorts itself out" and "resolves
  # itself" ride along as the idiomatic cousins.
  - (?:narrows?|scopes?|tunes?|optimi[sz]es?|tightens?|rewrites?|configures?|corrects?|prunes?|trims?)\sitself
  - sorts?\sitself\sout
  - resolves?\sitself
  # Self-report: an artifact vouching for or exposing itself ("the line
  # declares itself," "forgetting that announces itself," "the credential
  # path proves itself"). The plural stays off "versions" because "the
  # versions themselves" is an ordinary emphatic. Measured at zero across
  # the Go and Python standard libraries.
  - (?:declares?|announces?|proves?|reports?)\s(?:itself|themselves)
  - versions\sitself
  # Voice: a comparison or a gate that pipes up ("the check only speaks
  # up after the push").
  - speaks?\sup
  - spoke\sup
  - pretend(?:s|ed|ing)?\sotherwise
  - pretend(?:s|ed|ing)?\snot\sto
  - cares?\sdeeply
  # Deliberation: a reader or a tool credited with a verdict-in-progress
  # ("the reviewer forms an opinion," "the linter formed its own opinion")
  # where judges or decides names the act. Measured at zero across the Go
  # and Python standard libraries.
  - form(?:s|ed|ing)?\s(?:an|its\sown|their\sown)\sopinion
  - deliver(?:s|ed|ing)?\son\s(?:its|that|the|every)\spromise
  - keeps?\s(?:its|that)\spromise
  - breaks?\s(?:its|that)\spromise
  - hangs?\son\s(?:a\ssingle|(?:this\s|that\s)?one|whether|every\sword)
  - hangs?\sin\sthe\sbalance
  - hinges?\s(?:on|upon)\s(?:a\ssingle|(?:this\s|that\s)?one|whether|the\s(?:assumption|answer|outcome|question))
  - hinged\s(?:on|upon)\s(?:a\ssingle|(?:this\s|that\s)?one|whether)

  # "Adjudication" family.
  # A fact or metric handed the gavel: "the benchmark decides the
  # debate," "latency puts the matter to rest." State the conclusion
  # and the evidence instead of letting the noun rule on it. The same
  # gavel wielded through "settles" ("availability settles the
  # question," "the reconfirmation settles it") lives in
  # FigurativeSettles with the rest of that verb's figures, and the
  # invoice tokens ("settled the cost," "settles up," "squares the
  # ledger," "balances the books") live in FigurativePays with the
  # other money figures.
  - decides?\sthe\s(?:question|debate|matter|argument|issue|dispute)
  - decided\sthe\s(?:question|debate|matter|argument|issue|dispute)
  - puts?\sthe\s(?:question|debate|matter|argument|issue|dispute)\sto\s(?:rest|bed)
  - put\sthe\s(?:question|debate|matter|argument|issue|dispute)\sto\s(?:rest|bed)
  - lays?\sthe\s(?:question|debate|matter|argument|issue|dispute)\sto\srest
  - laid\sthe\s(?:question|debate|matter|argument|issue|dispute)\sto\srest

  # "Harm" family.
  # Treats inanimate subjects (a check, a config, a flag) as moral
  # agents capable of inflicting or withholding damage — the
  # Hippocratic register applied to code. "The check passes too
  # without doing harm." Technical writing rarely needs it; just say
  # what the change does or doesn't do.
  # NOTE: legitimate in medical / health-software prose ("the device
  # must do no harm"). No regex-clean way to detect that context;
  # disable this rule for those files via .vale.ini if needed.
  - does?\sharm
  - doing\sharm
  - does?\sno\sharm
  - doing\sno\sharm
  - without\sdoing\sharm
  - causes?\sharm
  - causing\sharm
  - without\scausing\sharm

  # "Naming" and "wanting" families, both left out of this rule. Both
  # verbs take inanimate subjects the way the families above do, and both
  # were rejected here on corpus evidence rather than by omission. "Wants"
  # stays uncovered; "names" was reopened on the maintainer's ask.
  #
  # "Names" as an act of designation reads like a tell ("it names a kind of
  # file", "the field names the target"), but it is ordinary Go and Python
  # documentation style: "IsDir reports whether the path names a directory",
  # "charset names the character set to use", "it names an importable
  # package". Every instance found in the two standard libraries is the
  # precise verb for what an identifier denotes, which kept it out of this
  # rule and left it to CommitFigurativeVerbs, where a commit message is
  # the text. The maintainer then met the verb in every document that
  # passed under the package, so BareNames (2026-09) flags it in prose at
  # its own corpus cost, the way BareHolds and BareReaches carry theirs,
  # and NamedAdjective takes "the named file." Nothing here changed; the
  # family has a rule of its own.
  #
  # "Wants" with an inanimate subject is more entrenched still: "gcc wants
  # to 8-align int64s", "the package wants to make the data available", "the
  # scheduler wants to preempt us". The same libraries reach for it freely
  # with software subjects, and no complement or subject gate separates that
  # register from the AI usage, so a rule here would flood.
