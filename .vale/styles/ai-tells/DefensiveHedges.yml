  - "\\b[Tt]hat\\smight\\ssound\\s[^,]+,\\sbut\\s[^.!?]+"

  # "Admittedly/Granted" openers
  - "\\bAdmittedly,\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\bGranted,\\s[^,]+,\\sbut\\s[^.!?]+"

  # "To be fair" pattern
  - "\\bTo\\sbe\\sfair,\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\bTo\\sbe\\shonest,\\s[^,]+,\\sbut\\s[^.!?]+"

  # "While this might/may appear" pattern
  - "\\bWhile\\sthis\\smight\\sappear\\s[^,]+,\\s[^.!?]+"
  - "\\bWhile\\sthis\\smay\\sappear\\s[^,]+,\\s[^.!?]+"
  - "\\bWhile\\sit\\smight\\sappear\\s[^,]+,\\s[^.!?]+"
  - "\\bWhile\\sit\\smay\\sappear\\s[^,]+,\\s[^.!?]+"

  # "Not meant to be X, but..." pattern
  - "\\b[Tt]his\\sisn'?t\\smeant\\sto\\sbe\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\b[Ii]t'?s\\snot\\smeant\\sto\\sbe\\s[^,]+,\\sbut\\s[^.!?]+"

  # "On the surface X, but..." pattern
  - "\\bOn\\sthe\\ssurface,\\s[^,]+,\\sbut\\s[^.!?]+"
