---
extends: existence
message: "AI defensive hedge: '%s'. State your point directly without pre-defending it."
level: error
nonword: true
tokens:
  # "This is more of X than Y, but..." pattern
  - "\\b[Tt]his\\sis\\smore\\sof\\s[^,]+\\sthan\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\b[Ii]t'?s\\smore\\sof\\s[^,]+\\sthan\\s[^,]+,\\sbut\\s[^.!?]+"

  # "Not the most X, but..." pattern
  - "\\b[Ii]t'?s\\snot\\sthe\\smost\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\b[Tt]his\\sisn'?t\\sthe\\smost\\s[^,]+,\\sbut\\s[^.!?]+"

  # "May seem/might seem X, but..." pattern
  - "\\b[Tt]his\\smay\\sseem\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\b[Tt]his\\smight\\sseem\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\b[Ii]t\\smay\\sseem\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\b[Ii]t\\smight\\sseem\\s[^,]+,\\sbut\\s[^.!?]+"

  # "Might sound X, but..." pattern
  - "\\b[Tt]his\\smight\\ssound\\s[^,]+,\\sbut\\s[^.!?]+"
