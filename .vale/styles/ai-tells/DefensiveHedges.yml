  # "At first glance" pattern
  - "\\bAt\\sfirst\\sglance,\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\bAt\\sfirst\\sglance\\sthis\\s[^,]+,\\sbut\\s[^.!?]+"

  # "I know this seems/sounds" pattern
  - "\\bI\\sknow\\sthis\\sseems\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\bI\\sknow\\sthis\\ssounds\\s[^,]+,\\sbut\\s[^.!?]+"
  - "\\bI\\sknow\\sit\\sseems\\s[^,]+,\\sbut\\s[^.!?]+"
