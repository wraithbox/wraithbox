---
extends: existence
message: "AI anaphora: '%s'. Vary the sentence openings or combine into one statement."
level: error
nonword: true
tokens:
  # "No X. No Y. No Z." pattern (3+ consecutive)
  - "\\bNo\\s[^.]+\\.\\sNo\\s[^.]+\\.\\sNo\\s[^.]+"

  # "No X. No Y." pattern (2 consecutive)
  - "\\bNo\\s\\w[^.]+\\.\\sNo\\s\\w[^.]+"

  # "No X, no Y, no Z." pattern (3+ comma-separated)
  # 2-item "No X, no Y." is owned by ContrastiveNegation; keep only 3+ here.
  - "\\bNo\\s[^,]+,\\sno\\s[^,]+,\\sno\\s[^.!?]+"

  # "Not X. Not Y. Not Z." pattern
  - "\\bNot\\s[^.]+\\.\\sNot\\s[^.]+\\.\\sNot\\s[^.]+"

  # "Not X. Not Y." pattern (2 consecutive)
  - "\\bNot\\s\\w[^.]+\\.\\sNot\\s\\w[^.]+"

  # "No more X. No more Y. No more Z." pattern
  - "\\bNo\\smore\\s[^.]+\\.\\sNo\\smore\\s[^.]+\\.\\sNo\\smore\\s[^.]+"

  # "No more X. No more Y." pattern (2 consecutive)
  - "\\bNo\\smore\\s\\w[^.]+\\.\\sNo\\smore\\s\\w[^.]+"

  # "It's X. It's Y. It's Z." pattern
  - "\\b[Ii]t'?s\\s[^.]+\\.\\s[Ii]t'?s\\s[^.]+\\.\\s[Ii]t'?s\\s[^.]+"

  # "This is X. This is Y. This is Z." pattern
  - "\\b[Tt]his\\sis\\s[^.]+\\.\\s[Tt]his\\sis\\s[^.]+\\.\\s[Tt]his\\sis\\s[^.]+"

  # Three consecutive rhetorical questions
  - "\\b(?:What|Why|How|Where|When|Who|Which|Is|Are|Can|Could|Should|Would|Do|Does)\\s[^?]+\\?\\s(?:What|Why|How|Where|When|Who|Which|Is|Are|Can|Could|Should|Would|Do|Does)\\s[^?]+\\?\\s(?:What|Why|How|Where|When|Who|Which|Is|Are|Can|Could|Should|Would|Do|Does)\\s[^?]+\\?"

  # "X works because Y. Z works because W." parallel justifications
  - "\\b[A-Z][^.]+works\\sbecause\\s[^.]+\\.\\s[A-Z][^.]+works\\sbecause\\s[^.]+\\.\\s[A-Z][^.]+works\\sbecause\\s[^.]+"

  # "One X. One Y. One Z." pattern (3+ consecutive)
  - "\\bOne\\s[^.]+\\.\\sOne\\s[^.]+\\.\\sOne\\s[^.]+"

  # "One X, one Y, one Z." pattern (3+ comma-separated)
  - "\\bOne\\s[^,]+,\\sone\\s[^,]+,\\sone\\s[^.!?]+"

  # "One X, one Y." pattern (2 comma-separated)
  - "\\bOne\\s[^,]+,\\sone\\s[^.!?]+"

  # "Every X. Every Y. Every Z." pattern (3+ consecutive)
  - "\\bEvery\\s[^.]+\\.\\sEvery\\s[^.]+\\.\\sEvery\\s[^.]+"

  # "Every X, every Y, every Z." pattern (3+ comma-separated)
  - "\\bEvery\\s[^,]+,\\severy\\s[^,]+,\\severy\\s[^.!?]+"

  # "Every X, every Y." pattern (2 comma-separated)
  - "\\bEvery\\s[^,]+,\\severy\\s[^.!?]+"

  # "Each X. Each Y. Each Z." pattern (3+ consecutive)
  - "\\bEach\\s[^.]+\\.\\sEach\\s[^.]+\\.\\sEach\\s[^.]+"

  # "Each X, each Y, each Z." pattern (3+ comma-separated)
  - "\\bEach\\s[^,]+,\\seach\\s[^,]+,\\seach\\s[^.!?]+"

  # "Each X, each Y." pattern (2 comma-separated)
  - "\\bEach\\s[^,]+,\\seach\\s[^.!?]+"

  # "Zero X. Zero Y. Zero Z." pattern (3+ consecutive)
  - "\\bZero\\s[^.]+\\.\\sZero\\s[^.]+\\.\\sZero\\s[^.]+"

  # "Zero X, zero Y, zero Z." pattern (3+ comma-separated)
  - "\\bZero\\s[^,]+,\\szero\\s[^,]+,\\szero\\s[^.!?]+"

  # "Zero X, zero Y." pattern (2 comma-separated)
  - "\\bZero\\s[^,]+,\\szero\\s[^.!?]+"

  # "A single X. A single Y." pattern (2+ consecutive)
  - "\\bA\\ssingle\\s[^.]+\\.\\sA\\ssingle\\s[^.]+"

  # "A single X, a single Y." pattern (2+ comma-separated)
  - "\\bA\\ssingle\\s[^,]+,\\sa\\ssingle\\s[^.!?]+"

  # "Many X. Many Y." pattern (2+ consecutive)
  - "\\bMany\\s[^.]+\\.\\sMany\\s[^.]+\\."

  # "Few X. Few Y." pattern (2+ consecutive)
  - "\\bFew\\s[^.]+\\.\\sFew\\s[^.]+\\."

  # "All X. All Y. All Z." pattern (3+ consecutive)
  - "\\bAll\\s[^.]+\\.\\sAll\\s[^.]+\\.\\sAll\\s[^.]+"

  # Three prepositional phrase chains: "with X, through Y, and for Z" style
  - "\\b(?:with|through|by|for|via|within)\\s[^,]+,\\s(?:with|through|by|for|via|within)\\s[^,]+,\\s(?:and\\s)?(?:with|through|by|for|via|within)\\s[^.!?]+"

  # === Adverb anaphora ===

  # "Always X. Always Y." pattern (2+ consecutive)
  - "\\bAlways\\s[^.]+\\.\\sAlways\\s[^.]+\\."

  # "always X, always Y." pattern (2+ comma-separated)
  - "\\b[Aa]lways\\s[^,]+,\\salways\\s[^.!?]+"

  # "Never X. Never Y." pattern (2+ consecutive)
  - "\\bNever\\s[^.]+\\.\\sNever\\s[^.]+\\."

  # "never X, never Y." pattern (2+ comma-separated)
  - "\\b[Nn]ever\\s[^,]+,\\snever\\s[^.!?]+"

  # "Fully X. Fully Y." pattern (2+ consecutive)
  - "\\bFully\\s[^.]+\\.\\sFully\\s[^.]+\\."

  # "fully X, fully Y." pattern (2+ comma-separated)
  - "\\b[Ff]ully\\s[^,]+,\\sfully\\s[^.!?]+"

  # "Completely X. Completely Y." pattern (2+ consecutive)
  - "\\bCompletely\\s[^.]+\\.\\sCompletely\\s[^.]+\\."

  # "completely X, completely Y." pattern (2+ comma-separated)
  - "\\b[Cc]ompletely\\s[^,]+,\\scompletely\\s[^.!?]+"

  # "Entirely X. Entirely Y." pattern (2+ consecutive)
  - "\\bEntirely\\s[^.]+\\.\\sEntirely\\s[^.]+\\."

  # "entirely X, entirely Y." pattern (2+ comma-separated)
  - "\\b[Ee]ntirely\\s[^,]+,\\sentirely\\s[^.!?]+"

  # "Truly X. Truly Y." pattern (2+ consecutive)
  - "\\bTruly\\s[^.]+\\.\\sTruly\\s[^.]+\\."

  # "truly X, truly Y." pattern (2+ comma-separated)
  - "\\b[Tt]ruly\\s[^,]+,\\struly\\s[^.!?]+"

  # "Purely X. Purely Y." pattern (2+ consecutive)
  - "\\bPurely\\s[^.]+\\.\\sPurely\\s[^.]+\\."

  # "purely X, purely Y." pattern (2+ comma-separated)
  - "\\b[Pp]urely\\s[^,]+,\\spurely\\s[^.!?]+"

  # "Only X. Only Y." pattern (2+ consecutive)
  - "\\bOnly\\s[^.]+\\.\\sOnly\\s[^.]+\\."

  # "only X, only Y." pattern (2+ comma-separated)
  - "\\b[Oo]nly\\s[^,]+,\\sonly\\s[^.!?]+"

  # "Just X. Just Y." pattern (2+ consecutive)
  - "\\bJust\\s[^.]+\\.\\sJust\\s[^.]+\\."

  # "just X, just Y." pattern (2+ comma-separated)
  - "\\b[Jj]ust\\s[^,]+,\\sjust\\s[^.!?]+"

  # === Indefinite-article exemplification stack ===
  # AI loves stacking hypothetical scenarios as parallel sentences:
  # "A hook wants to count failures. A subagent wants to record a
  # result. A skill wants to stash a value." The pattern — A/An +
  # noun (1-3 words) + present-tense verb — paired across 3
  # sentences is distinctive enough to flag even when verbs differ.
  - "\\b(?:A|An)\\s\\w+(?:\\s\\w+){0,2}\\s\\w+s\\s[^.]+\\.\\s(?:A|An)\\s\\w+(?:\\s\\w+){0,2}\\s\\w+s\\s[^.]+\\.\\s(?:A|An)\\s\\w+(?:\\s\\w+){0,2}\\s\\w+s\\s[^.!?]+"

  # 2-sentence parallel-mirror pair: "An unset X counts as Y.
  # A set-but-wrong value belongs to Z." Same A/An + NP + verb-s
  # pattern but paired instead of tripled. Common in technical prose
  # written by humans too, but the dramatic shared-verb framing
  # reads as an AI tell in practice.
  - "\\b(?:A|An)\\s\\w+(?:\\s\\w+){0,2}\\s\\w+s\\s[^.]+\\.\\s(?:A|An)\\s\\w+(?:\\s\\w+){0,2}\\s\\w+s\\s[^.!?]+"

  # === Definite-article noun-list fragment ===
  # "The X, the Y, the Z." — three or more comma-separated
  # definite noun phrases as a verbless sentence. AI uses this
  # as a faux-summary closer. Subjects are up to 5 words to
  # tolerate parenthetical glosses like "Time-To-Live (TTL)".
  # Sentence-initial capital "The" reduces mid-sentence
  # false positives.
  - "\\bThe\\s[\\w-]+(?:\\s[\\w-]+){0,4}(?:,\\sthe\\s[\\w-]+(?:\\s[\\w-]+){0,4}){2,}\\."

  # === "Whether X, or whether Y." subordinate-clause fragment ===
  # AI promotes a "whether... or whether..." subordinate-clause
  # pair to a standalone sentence with no main clause. The
  # paired "whether" markers carry the rhetorical weight a real
  # verb would carry.
  - "\\bWhether\\s[^.]+,\\sor\\swhether\\s[^.!?]+\\."

  # Two consecutive "Whether X." sentences — same pattern, paired.
  - "\\bWhether\\s[^.]+\\.\\sWhether\\s[^.]+\\."

  # === Paired "For X, ... For Y," scope openers ===
  # Two consecutive sentences each fronted by a "For <scope>," label:
  # "For search, that join reverses. For writes, the table takes one
  # append." The single fronted "For X," is ordinary English several
  # hundred times over in the Go and Python standard libraries, so only
  # the pair fires, and the discourse markers ("For example," "For now,"
  # "For simplicity,") are excluded at either position. The pair matches
  # one corpus hit with those out, the fmt docs ("For Scanln, it stops at
  # newlines. For Scan,"), which is the construction itself and fires by
  # design. ScopePartition owns the "On the X side," and "At X time,"
  # spellings of the same move.
  - "\\bFor\\s(?!(?:example|instance|now|details|more|this|that|these|those|some|historical|backward|backwards|simplicity|performance|efficiency|convenience|consistency|compatibility|clarity|debugging|testing|security|reference|completeness|context|comparison|brevity|safety|starters|any|all|each|every|the|a|an|one|its|our|your|my|their|no|most|many|what|whatever)\\b)[A-Za-z][a-z-]*(?:\\s[a-z-]+)?,\\s[^.]+\\.\\sFor\\s(?!(?:example|instance|now|details|more|this|that|these|those|some|historical|backward|backwards|simplicity|performance|efficiency|convenience|consistency|compatibility|clarity|debugging|testing|security|reference|completeness|context|comparison|brevity|safety|starters|any|all|each|every|the|a|an|one|its|our|your|my|their|no|most|many|what|whatever)\\b)[A-Za-z][a-z-]*(?:\\s[a-z-]+)?,"
