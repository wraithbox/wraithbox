---
extends: existence
message: "AI mic-drop: '%s'. Use a descriptive heading instead."
level: error
nonword: true
scope: heading
tokens:
  # "X, not Y" / "X, never Y"
  - "\\b[A-Z][a-z]+,\\snot\\s[a-z]+"
  - "\\b[A-Z][a-z]+,\\snever\\s[a-z]+"

  # "X, then Y"
  - "\\b[A-Z][a-z]+,\\sthen\\s[a-z]+"

  # "X over Y"
  - "\\b[A-Z][a-z]+\\sover\\s[a-z]+"

  # "X first, Y second"
  - "\\b[A-Z][a-z]+\\sfirst,\\s[a-z]+\\ssecond\\b"
  - "\\b[A-Z][a-z]+\\sfirst,\\s[a-z]+\\snever\\b"
