# Advisory overrides for `mise run vuln` (AGENTS.md, "Supply chain").
#
# An entry lets a change merge while an advisory has no fix. Each entry
# names one advisory, expires at most 30 days after it is added, and its
# reason starts with the issue that tracks the fix. scripts/osv-ignores.mjs
# checks that before every scan. Agents may edit this file, and every edit
# asks the maintainer first. When an entry expires the scan fails again,
# and the entry is removed or extended on purpose.

