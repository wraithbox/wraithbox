version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - cyclop
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gocognit
    - gocritic
    - gosec
    - misspell
    - modernize
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - recvcheck
    - revive
    - sloglint
    - unconvert
    - unparam
    - usetesting
  # Maintainability gate, the Go counterpart of .swiftlint.yml
  # (S10-tech-stack, "Quality gates"). Refactor to pass. Do not raise a
  # threshold or suppress a finding to go green. A limit that is wrong for
  # the code base is changed here, with the reason, in its own commit.
  settings:
    # Cognitive complexity is the main gate: it charges for nesting and
    # breaks in linear flow, and a switch counts once.
    gocognit:
      min-complexity: 15
    # Cyclomatic backstop. Higher than SwiftLint's 10 because Go cannot
    # skip switch cases, and protocol parsers switch on many values.
    cyclop:
      max-complexity: 15
    nestif:
      min-complexity: 4
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    # A switch on a protocol or policy enum names every value. A default
    # branch does not count, so a new value fails lint instead of falling
    # through (fail closed).
    exhaustive:
      default-signifies-exhaustive: false
    revive:
      enable-default-rules: true
      rules:
        - name: argument-limit
          arguments: [6]
        - name: function-result-limit
          arguments: [3]
        - name: file-length-limit
          arguments:
            - max: 800
              skipComments: true
              skipBlankLines: true
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # Table-driven tests are long by design. gocognit still applies.
      - path: _test\.go
        linters:
          - funlen

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Report every linter's finding, not only the first on a line: a long
  # function header otherwise shows funlen or cyclop, never both.
  uniq-by-line: false
