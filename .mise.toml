# mise: https://mise.jdx.dev/
#
# One-stop toolchain + task runner for this monorepo (Go + Swift + docs).
# Go is built and tested on macOS, Linux and Windows; Swift on macOS only.
# `mise install` installs everything under [tools]; `mise run <task>`
# dispatches to the native toolchain per language.
#
# Native per-language pin files are kept alongside this one (go.work /
# go.mod's `go` directive, Package.swift's tools version) so contributors
# without mise can still use the native tools directly. If both are
# present, they must agree.
#
# Swift is the exception to "mise pins every toolchain": the Swift
# compiler, `swift-format` and `xcodebuild` ship inside Xcode and are
# pinned implicitly by the Xcode version (see docs/spec/S02-toolchain.md).
# Only SwiftLint, which Xcode does not ship, is pinned here.

[settings]
minimum_release_age = "7d"
lockfile = true

# mise.lock records a checksum per tool per platform. `govulncheck` has
# none: it is compiled from source via the `go:` backend, and the Go
# checksum database authenticates the module download instead. Everything
# else is verified by mise. If the tool list changes, regenerate with
# `mise lock` and read the diff.

# Every tool is pinned to an exact version, deliberately and without
# exception. This is a supply-chain rule, not a stability one: an upstream
# compromise must never be auto-downloaded. Nothing here is covered by
# dependabot, so these go stale silently. Refresh them deliberately with
# `mise up`, read the diff, and keep the native pin files in step
# (`go.work` and each `go.mod` for go).
#
# The 7-day cooldown this repo applies to *dependencies* (dependabot
# cooldown) is deliberately NOT applied here: tool versions are chosen by
# a human reading a changelog, not resolved automatically.
[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
gofumpt = "0.12.0"
# Swift maintainability gate (complexity/size rules only; see .swiftlint.yml).
# macOS only, like all Swift here: it has no Windows build, and `mise run`
# installs every applicable tool before a task, so on the Windows Go job an
# unrestricted entry fails the job before any Go runs.
swiftlint = { version = "0.63.3", os = ["macos"] }
# Docs site (packages/wraithbox-doc): Astro Starlight builds with bun.
bun = "1.4.2"
# Used by `mise run audit`; must match `version:` on the workflow's
# zizmor step. Bump them together.
zizmor = "1.30.1"
# Used by `mise run gha:lint`. actionlint shells out to shellcheck for
# the `run:` blocks in workflows, and silently skips that half if
# shellcheck is missing, so it is pinned here too.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Used by `mise run vuln:osv`: one scanner for go.mod, bun.lock and
# SwiftPM's Package.resolved.
osv-scanner = "2.5.1"
# Used by `mise run go:vulncheck`. Not redundant with osv-scanner: osv
# reads go.mod, so it never sees the Go *toolchain*, and a Go stdlib CVE
# is invisible to it. govulncheck also does reachability analysis.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
# Prose lint (`mise run prose:lint`). Its style packages are vendored
# under .vale/styles/ (see .vale.ini), so the lint needs no network.
vale = "3.23.0"
# Used by `mise run proto:check` and `proto:generate`: lints the .proto
# contracts, checks them for breaking changes against main, and runs the
# code generators (B52-proto-contracts). Every plugin it runs is local:
# the Go ones are `tool` lines in packages/wraithbox-go/go.mod, the Swift
# ones are built from the pinned SwiftPM dependencies. No `remote:`
# plugin, so `ci` stays offline.
buf = "1.73.0"
# cspell is deliberately not here. mise's `npm:` backend records no
# checksum in mise.lock and resolves the package's dependency tree from
# the registry at install time. It is an exact-pinned devDependency of
# packages/wraithbox-doc instead, where bun.lock pins the whole tree, and
# `mise run prose:spell` runs it from that package's node_modules.

# Project-scoped env: load an optional .env if present (fnox-generated
# or hand-written). Keep secrets out of git; use fnox for op:// refs.
[env]
_.file = { path = ".env", optional = true }

# ---------- Top-level fan-outs ----------
[tasks.install]
description = "Install all dependencies"
depends = ["doc:install"]

# The frozen counterpart, for the gate: a manifest edit that the committed
# lock does not reflect is an error instead of a silent re-resolve.
[tasks."install-frozen"]
description = "Install all dependencies, failing on a stale lock"
depends = ["doc:install-frozen"]

[tasks.lint]
description = "Run all linters"
depends = ["go:lint", "proto:check", "swift:lint", "proto:check-swift", "gha:lint", "prose:lint", "prose:spell"]

[tasks.format]
description = "Auto-format all languages"
depends = ["go:format", "swift:format"]

[tasks.typecheck]
description = "Run type/content checkers (go vet + docs)"
depends = ["go:vet", "doc:check"]

[tasks.test]
description = "Run all tests"
depends = ["go:test", "go:fuzz", "swift:test"]

[tasks.build]
description = "Build all buildable targets"
depends = ["go:build", "swift:build", "swift:sign", "doc:build"]

[tasks.ci]
description = "Full CI gate: lint + typecheck + test + build (+ Go cross-OS check)"
depends = ["lint", "typecheck", "test", "build", "go:cross"]

[tasks.clean]
description = "Remove all build output and installed deps"
run = """
rm -rf node_modules packages/*/node_modules
rm -rf packages/*-swift/.build packages/*-swift/.swiftpm
rm -rf packages/wraithbox-doc/.astro
find packages -name 'bin' -maxdepth 2 -type d -exec rm -rf {} +
find packages -name 'dist' -maxdepth 2 -type d -exec rm -rf {} +
rm -rf build
"""

# ---------- Build version ----------
# One version for the whole run (S10-02-packaging-and-signing, "One build
# version"): VERSION, the commit, and for a modified tree a nonce.
# go:build and swift:build depend on this task, so `mise run build` runs
# it once and both read the same build/version. A build task run alone
# makes a new nonce, so a partial rebuild of a modified tree needs a full
# build. A Go program, so it runs under cmd.exe (S02-toolchain).
[tasks."version:stamp"]
description = "Write this run's build version to build/version"
dir = "packages/wraithbox-go"
run = "go run ./internal/tools/buildversion stamp"

# ---------- Go ----------
# One Go module, packages/wraithbox-go. The tasks run there with plain
# commands rather than shell loops, because the Go jobs also run on
# Windows, where mise executes `run` with cmd.exe. A second Go module
# means extending these tasks deliberately (see docs/spec/S02-toolchain.md).
#
# golangci-lint also enforces gofumpt and goimports (`formatters:` in
# .golangci.yml), so there is no separate format check.
[tasks."go:lint"]
description = "golangci-lint (linters + formatters) for the native OS"
dir = "packages/wraithbox-go"
run = "golangci-lint run ./..."

[tasks."go:format"]
dir = "packages/wraithbox-go"
run = "gofumpt -w ."

[tasks."go:vet"]
dir = "packages/wraithbox-go"
run = "go vet ./..."

# -race needs cgo and a C compiler, which hosted Windows runners do not
# guarantee; Windows runs without it rather than failing on the toolchain.
#
# The Go distribution ships no prebuilt covdata: `go tool covdata` builds
# it into the build cache on first use. `go test -cover` runs one
# `go tool covdata` per package without test files, in parallel, so on a
# cold cache one of them can exec the binary while another is still
# writing it, and Linux refuses with "text file busy" (ETXTBSY, #217).
# `go tool -n covdata` builds it once, before the tests, and prints its
# path.
[tasks."go:test"]
dir = "packages/wraithbox-go"
run = ["go tool -n covdata", "go test -race -cover ./..."]
run_windows = ["go tool -n covdata", "go test -cover ./..."]

# Runs every Go fuzz target for 10s, the fuzz smoke run of
# S11-verification-and-spikes. internal/tools/fuzzsmoke finds the targets
# with `go test -list`, so a new target needs no change here. It is a Go
# program rather than a shell loop so that it runs under cmd.exe
# (S02-toolchain). CI runs it on Linux only.
#
# Fuzzing takes every CPU, so under `ci` this waits for go:test instead of
# starving its -race run. wait_for orders without depending: `mise run
# go:fuzz` alone does not pull in go:test.
[tasks."go:fuzz"]
description = "Run every Go fuzz target for 10s each (fuzz smoke run)"
dir = "packages/wraithbox-go"
wait_for = ["go:test"]
run = "go run ./internal/tools/fuzzsmoke"

# `go build ./...` builds every package and keeps nothing. The second
# command builds the programs into bin/, stamped with the run's version
# (internal/tools/buildversion).
[tasks."go:build"]
dir = "packages/wraithbox-go"
depends = ["version:stamp"]
run = ["go build ./...", "go run ./internal/tools/buildversion go-build"]

# Vet, lint and build for every host OS from one machine, so files with
# GOOS suffixes cannot rot on the OSes a developer does not use. CI runs
# go:lint/go:vet/go:test natively on all three instead (S02-toolchain). Unix
# shell only; not run on Windows.
#
# golangci-lint refuses to run while another instance holds its lock
# ("parallel golangci-lint is running"), so under `ci` this task waits
# for go:lint instead of racing it. wait_for orders without depending:
# `mise run go:cross` alone does not pull in go:lint.
[tasks."go:cross"]
description = "go vet + golangci-lint + go build for darwin, linux and windows"
dir = "packages/wraithbox-go"
wait_for = ["go:lint"]
run = """
set -e
for os in darwin linux windows; do
  echo "--- GOOS=$os"
  GOOS=$os go vet ./...
  GOOS=$os golangci-lint run ./...
  GOOS=$os go build -o /dev/null ./...
done
"""

# Run by `mise run vuln`, not by `go:lint`: it needs network access.
# Analyses each host OS build, since reachability differs per GOOS.
[tasks."go:vulncheck"]
description = "govulncheck for darwin, linux and windows (stdlib + deps, reachability-aware)"
dir = "packages/wraithbox-go"
run = """
set -e
for os in darwin linux windows; do
  echo "--- govulncheck GOOS=$os"
  GOOS=$os govulncheck ./...
done
"""

# ---------- Swift ----------
# Each packages/*-swift directory is a standalone SwiftPM package. The
# compiler and swift-format come from the selected Xcode (`xcode-select
# -p`); see docs/spec/S02-toolchain.md for which Xcode. Every task that
# builds passes --force-resolved-versions, so a stale Package.resolved
# fails instead of resolving again.
[tasks."swift:lint"]
description = "swift-format lint (strict) + SwiftLint maintainability gate"
run = """
set -e
for p in packages/*-swift; do
  [ -d "$p" ] || continue
  echo "--- swift format lint $p"
  swift format lint --strict --recursive "$p/Package.swift" "$p/Sources" "$p/Tests"
done
swiftlint lint --strict --quiet
"""

[tasks."swift:format"]
run = """
set -e
for p in packages/*-swift; do
  [ -d "$p" ] || continue
  swift format --in-place --recursive "$p/Package.swift" "$p/Sources" "$p/Tests"
done
"""

# The linker copies build/version, the run's version, into the section
# __TEXT,__wb_version of each program, where WraithBoxVM/Version.swift
# reads it. Changing the flag relinks, and recompiles nothing. `check`
# fails first when the tree changed after the stamp was made.
#
# SwiftPM locks .build, and `swift test` relinks the programs without the
# stamp. So under `ci` this waits for swift:test, and the stamped
# programs are the last ones built.
[tasks."swift:build"]
depends = ["version:stamp"]
wait_for = ["swift:test"]
run = """
set -e
go -C packages/wraithbox-go run ./internal/tools/buildversion check
stamp="$PWD/build/version"
for p in packages/*-swift; do
  [ -d "$p" ] || continue
  echo "--- swift build $p"
  swift build --package-path "$p" --force-resolved-versions -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __wb_version -Xlinker "$stamp"
done
"""

[tasks."swift:test"]
run = """
set -e
for p in packages/*-swift; do
  [ -d "$p" ] || continue
  echo "--- swift test $p"
  swift test --package-path "$p" --force-resolved-versions
done
"""

# A copy of wb-vmd in .build/signed, ad-hoc signed with the hardened
# runtime and exactly the entitlement in wb-vmd.entitlements
# (S15-01-rights, "Hardening and entitlements"). A copy, so a later build
# doesn't relink over the signature. Developer ID signing is the
# maintainer's (I118).
[tasks."swift:sign"]
description = "Ad-hoc sign a copy of wb-vmd with the hardened runtime and its entitlement (macOS)"
depends = ["swift:build"]
wait_for = ["swift:test"]
run = """
set -e
p=packages/wraithbox-swift
out="$p/.build/signed"
bin="$(swift build --package-path "$p" --force-resolved-versions --show-bin-path)/wb-vmd"
mkdir -p "$out"
rm -f "$out/wb-vmd" "$out/entitlements.plist"
cp "$bin" "$out/wb-vmd"
codesign --force --sign - --options runtime --entitlements "$p/wb-vmd.entitlements" "$out/wb-vmd"
codesign --verify --strict "$out/wb-vmd"
codesign --display --verbose "$out/wb-vmd" 2>&1 | grep -q 'flags=.*runtime'
codesign --display --entitlements "$out/entitlements.plist" --xml "$out/wb-vmd"
test "$(plutil -convert json -o - "$out/entitlements.plist")" = "$(plutil -convert json -o - "$p/wb-vmd.entitlements")"
echo "signed $out/wb-vmd"
"""

# needs-vm, attended (docs/agents/host-work.md): clones the spike bundle
# WB_VM_TEST_BUNDLE names into the work slot's bundle under <data>, boots
# it with the signed wb-vmd, and deletes the slot (VMBootTests).
[tasks."swift:test-vm"]
description = "Boot a macOS guest from WB_VM_TEST_BUNDLE with the signed wb-vmd (needs-vm, macOS)"
depends = ["swift:sign"]
run = """
set -e
test -n "$WB_VM_TEST_BUNDLE" || { echo "set WB_VM_TEST_BUNDLE to a spike bundle" >&2; exit 2; }
swift test --package-path packages/wraithbox-swift --force-resolved-versions --filter VMBootTests
"""

# ---------- Contracts (.proto) ----------
# The .proto files in proto/ are the one contract for every language, and
# the code generated from them is committed (B52-proto-contracts, decision
# A on I52): Go for every package under packages/wraithbox-go/internal/gen,
# Swift for wraithbox.vmd.v1 in the WraithBoxRPC target. Every plugin is
# local (buf.gen.yaml, buf.gen.swift.yaml), so these tasks need no network.
# Unix shell only, like go:cross: the Windows Go job doesn't run them.
[tasks."proto:generate"]
description = "Regenerate the Go code for every .proto package (buf generate)"
run = "buf generate"

# The Swift plugins are built from the pinned SwiftPM dependencies into
# .build/debug, where buf.gen.swift.yaml runs them. SwiftPM locks .build,
# so under `ci` this waits for the Swift build and tests.
[tasks."proto:swift-plugins"]
description = "Build protoc-gen-swift and protoc-gen-grpc-swift-2 from the Swift package's pinned dependencies (macOS)"
wait_for = ["swift:build", "swift:test"]
run = """
set -e
swift build --package-path packages/wraithbox-swift --force-resolved-versions --product protoc-gen-swift
swift build --package-path packages/wraithbox-swift --force-resolved-versions --product protoc-gen-grpc-swift-2
"""

[tasks."proto:generate-swift"]
description = "Regenerate the Swift code for wraithbox.vmd.v1 in WraithBoxRPC (macOS)"
depends = ["proto:swift-plugins"]
run = "buf generate --template buf.gen.swift.yaml"

# `buf lint`, then `buf breaking` against main, then Go drift. The
# baseline is origin/main, or WB_PROTO_AGAINST when set (a commit or
# ref). With no baseline the task fails: run `git fetch origin main`.
# Before the first contract landed, main had no .proto file and so no
# baseline to compare with. That case is checked and said, not skipped
# silently. Generation goes to a temporary directory and is compared with
# the committed tree, so the check never rewrites files that go:lint and
# go:test read while `ci` runs them in parallel.
[tasks."proto:check"]
description = "buf lint, buf breaking against main, and a drift check of the generated Go code"
run = """
set -eu
buf lint
base="${WB_PROTO_AGAINST:-origin/main}"
if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
  echo "proto:check: no $base to compare with. Run git fetch origin main, or set WB_PROTO_AGAINST." >&2
  exit 1
fi
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
if git ls-tree -r --name-only "$base" -- proto | grep -q '[.]proto$'; then
  mkdir "$tmp/base"
  git archive "$base" buf.yaml proto | tar -x -C "$tmp/base"
  buf breaking --against "$tmp/base"
  echo "buf breaking: no breaking change against $base"
else
  echo "buf breaking: $base has no .proto file, so there is nothing to compare with"
fi
buf generate -o "$tmp/gen"
if ! diff -r packages/wraithbox-go/internal/gen "$tmp/gen/packages/wraithbox-go/internal/gen"; then
  echo "proto:check: the generated Go code differs from the .proto files. Run mise run proto:generate, and never edit generated files by hand." >&2
  exit 1
fi
"""

# The Swift half of the drift check. It needs macOS, so CI runs it in the
# Swift job.
[tasks."proto:check-swift"]
description = "Drift check of the generated Swift code in WraithBoxRPC (macOS)"
depends = ["proto:swift-plugins"]
run = """
set -eu
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
buf generate --template buf.gen.swift.yaml -o "$tmp"
if ! diff -r packages/wraithbox-swift/Sources/WraithBoxRPC "$tmp/packages/wraithbox-swift/Sources/WraithBoxRPC"; then
  echo "proto:check-swift: the generated Swift code differs from the .proto files. Run mise run proto:generate-swift, and never edit generated files by hand." >&2
  exit 1
fi
"""

# ---------- GitHub Actions ----------
[tasks."gha:lint"]
description = "actionlint (+ shellcheck) over .github/workflows"
run = "actionlint"

# Local mirror of the `zizmor` CI step. Not part of `ci` because it needs
# network access and a GitHub token for the online audits. Without a
# token zizmor silently skips the `impostor-commit` and
# `known-vulnerable-actions` audits, so refuse to run rather than pass a
# weaker check. Scoped to `.github` so the docs site's node_modules is
# not walked; `inputs:` on the CI zizmor step matches.
[tasks.audit]
description = "zizmor audit of GitHub Actions workflows + dependabot config"
run = """
set -e
token="${GH_TOKEN:-}"
if [ -z "$token" ]; then token="${GITHUB_TOKEN:-}"; fi
if [ -z "$token" ]; then token=$(gh auth token 2>/dev/null) || true; fi
if [ -z "$token" ]; then
  echo "No GitHub token: run \\`gh auth login\\`, or export GH_TOKEN." >&2
  echo "Refusing to run a partial audit — the online audits" >&2
  echo "(impostor-commit, known-vulnerable-actions) would be skipped." >&2
  exit 1
fi
unset GH_TOKEN GITHUB_TOKEN
zizmor --github-token "$token" --collect=all --strict-collection .github
"""

# ---------- Dependency vulnerability scanning ----------
# Deliberately NOT part of `ci`: both scanners query a remote database,
# and `ci` stays runnable offline. CI runs this in its own `vuln` job.
[tasks.vuln]
description = "Scan every lockfile for known vulnerabilities (network; not part of `ci`)"
depends = ["vuln:osv", "go:vulncheck"]

# The lockfiles come from git and go to the scanner one `-L` each. A
# recursive walk (`scan source -r .`) is not used: osv-scanner applies
# the `.gitignore` of every enclosing directory, so in a linked worktree
# under `.claude/worktrees/` (ignored by the main checkout) it walks
# nothing and finds no lockfile (#92). `git ls-files` reads only the
# checkout's own ignore rules. `--others --exclude-standard` adds
# lockfiles not yet `git add`ed, the same set the walk used to see. A new
# package manager means a new lockfile: add its pattern to `patterns`.
#
# Because a missed lockfile passes silently, the loop after the scan
# fails if the scanner did not report opening every listed file, and the
# task fails if git lists none at all.
#
# `--config` names the root `osv-scanner.toml` for every lockfile. Without
# it the scanner looks for a config next to each lockfile, so the file
# would not apply to `packages/wraithbox-doc/bun.lock`. The file holds
# expiring advisory overrides (AGENTS.md, "Supply chain"), which
# `scripts/osv-ignores.mjs` checks first, and the scanner prints each
# advisory it leaves out, with the reason.
[tasks."vuln:osv"]
description = "osv-scanner over every lockfile git lists (tracked, or untracked and not ignored)"
run = '''
# -f turns off filename globbing for the whole script. Without it the
# shell expands `$patterns` against the repository root before git sees
# it: a stray root `bun.lock` would turn `*bun.lock` into `bun.lock` and
# drop every nested one. `$locks` below is split with globbing off too.
set -euf
bun scripts/osv-ignores.mjs osv-scanner.toml
patterns="*bun.lock *go.mod *Package.resolved"
# shellcheck disable=SC2086 # word splitting is the point: one argument per pattern; set -f stops globbing
locks=$(git ls-files --cached --others --exclude-standard -- $patterns)
if [ -z "$locks" ]; then
  echo "git lists no lockfile matching: $patterns" >&2
  exit 1
fi
set --
for lock in $locks; do
  set -- "$@" -L "$lock"
done
status=0
out=$(osv-scanner scan source --config osv-scanner.toml "$@" 2>&1) || status=$?
echo "$out"

missing=0
for lock in $locks; do
  # The full path: `/bun.lock file and found` alone would also match a
  # nested bun.lock, and pass a root one the scanner never opened.
  case "$out" in
    *"Scanned $PWD/$lock file and found"*) ;;
    *)
      echo "osv-scanner never opened $lock — its dependencies went unscanned." >&2
      missing=1
      ;;
  esac
done
if [ "$missing" -ne 0 ]; then
  echo "Every lockfile git lists must be scanned. Check that osv-scanner" >&2
  echo "supports its format." >&2
  exit 1
fi
exit "$status"
'''

# ---------- Prose ----------
# Both tasks take their file list from git, so build output, node_modules
# and the vendored Vale styles are never read, and a new file is checked
# before its `git add`. CLAUDE.md is a symlink to AGENTS.md and would
# count twice. CODE_OF_CONDUCT.md is the Contributor Covenant, quoted
# verbatim.
#
# Vale reads Markdown and MDX only: README, AGENTS.md, CONTRIBUTING.md,
# docs/spec/ and the docs site. It deliberately does not lint comments in
# source code or config files: a trial run found little there besides
# section rulers, command-line flags, and terse comment style (S02-toolchain).
# Errors fail. Warnings print and are for the author to judge. Vale's
# exit code counts errors only, so one run does both.
[tasks."prose:lint"]
description = "Vale prose lint over Markdown and MDX; errors fail, warnings advise"
run = """
set -e
files=$(git ls-files --cached --others --exclude-standard -- '*.md' '*.mdx' ':!CLAUDE.md' ':!CODE_OF_CONDUCT.md')
# shellcheck disable=SC2086 # word splitting is the point: one argument per file
vale $files
"""

# Spell check in American English over every tracked text file, source
# code included: identifiers are split into words, and with the project
# words in cspell-words.txt it reports little but real typos. cspell.json
# skips lockfiles, binaries, the vendored Vale styles, Markdown code
# spans, GHSA advisory IDs and hex color codes. cspell comes from the
# docs package's bun-locked install (see [tools]), so run `mise run
# install` first.
[tasks."prose:spell"]
description = "cspell (American English) over every tracked text file"
run = """
set -e
files=$(git ls-files --cached --others --exclude-standard -- ':!CLAUDE.md')
# shellcheck disable=SC2086 # word splitting is the point: one argument per file
bun packages/wraithbox-doc/node_modules/.bin/cspell --no-progress --no-summary $files
"""

# ---------- Docs (Astro Starlight) ----------
[tasks."doc:install"]
description = "Install the docs site dependencies (bun); may update bun.lock"
dir = "packages/wraithbox-doc"
run = "bun install"

[tasks."doc:install-frozen"]
description = "Install the docs site dependencies, failing on a stale bun.lock"
dir = "packages/wraithbox-doc"
run = "bun install --frozen-lockfile"

[tasks."doc:dev"]
description = "Start the live-reloading docs dev server"
dir = "packages/wraithbox-doc"
run = "bun run dev"

# `doc:check` and `doc:build` both regenerate .astro/ and race when `ci`
# runs them in parallel (rename ENOENT on content-modules.mjs). `wait_for`
# serializes them only when both are in the same run; it does not make
# `doc:build` run the check on its own.
[tasks."doc:build"]
description = "Build the static docs site into packages/wraithbox-doc/dist"
dir = "packages/wraithbox-doc"
wait_for = ["doc:check"]
run = "bun run build"

[tasks."doc:preview"]
description = "Preview the production docs build"
dir = "packages/wraithbox-doc"
run = "bun run preview"

[tasks."doc:check"]
description = "Astro type/content check for the docs site"
dir = "packages/wraithbox-doc"
run = "bunx astro check"

[tasks."doc:refs"]
description = "Refresh the issue and pull request titles behind the docs hover cards (needs gh and the network)"
dir = "packages/wraithbox-doc"
run = "bun run scripts/github-refs.mjs"

[tasks."doc:index"]
description = "Rewrite the ID | Description | Status table of every index in docs/ (S00-index, FR00-index, …)"
dir = "packages/wraithbox-doc"
run = "bun run scripts/indexes.mjs"

[tasks."doc:structure"]
description = "List where each spec breaks a size limit (page, section, list depth, paragraph, sentence); fails for the specs the build holds to them"
dir = "packages/wraithbox-doc"
run = "bun run scripts/structure.mjs"

[tasks."doc:favicon"]
description = "Regenerate the docs favicons + apple-touch-icon from design/*.svg"
dir = "packages/wraithbox-doc"
run = "bun run scripts/gen-favicon.mjs"

[tasks."doc:clean"]
description = "Remove docs build artifacts"
run = "rm -rf packages/wraithbox-doc/dist packages/wraithbox-doc/.astro"

[tasks."doc:browser"]
description = "Install the Chromium browser Playwright uses for screenshots"
dir = "packages/wraithbox-doc"
run = "bunx playwright install chromium"

[tasks."doc:screenshot"]
description = "Build, serve, and screenshot a page (args: [out] [path]). Needs `mise run doc:browser` once."
dir = "packages/wraithbox-doc"
run = """
out="{{arg(name='out', default='out.png')}}"
path="{{arg(name='path', default='/')}}"
bun run build
bun run preview --port 4321 > /tmp/astro-preview.log 2>&1 &
sleep 4
bunx playwright screenshot --viewport-size=1280,800 "http://localhost:4321${path}" "$out"
status=$?; pkill -f "astro preview" || true; exit $status
"""

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""

# ---------- Spike VM bundles ----------
# Spikes keep macOS VM bundles in ~/Library/Caches/wraithbox-spikes/
# (docs/agents/planning.md, "Spikes"). Agents may run this task, so the
# script refuses anything but a spike's own directories: never
# restore-images/, a symbolic link, a path outside the cache, a mounted
# volume, or a directory with a KEEP file.
# The arguments mise passes after the task name go to the script.
[tasks."spike:clean"]
description = "Remove a spike's VM bundles from the spike cache (args: x<NN>...); without arguments, list the cache"
run = "bun scripts/spike-clean.mjs"

# Tests for the scripts in scripts/. Not in `test` yet: the CI workflow
# runs each task by name, and both lists must name the same checks.
[tasks."scripts:test"]
description = "bun test for the scripts in scripts/"
run = "bun test ./scripts"

[tasks."gh:labels"]
description = "Create or update the GitHub issue labels in .github/labels.yml and labels-areas.yml (network; needs `gh auth login`)"
run = "bun .github/sync-labels.ts .github/labels.yml .github/labels-areas.yml"
