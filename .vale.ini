# Vale prose lint: `mise run prose:lint`. Errors fail the build; warnings
# print on every run and are for the author and reviewer to judge.
#
# Ported from lsimons/ai-training (its .vale.ini and .vale/styles/House),
# which decided the rules below one by one. The lesson-specific parts
# (Readability, the per-lesson ratchet, acronym checks, the site-data
# YAML) are left out: this repository has specs and docs, not lessons.
#
# Scope: Markdown and MDX only (README, AGENTS.md, CONTRIBUTING.md,
# docs/spec/, the docs site). Vale deliberately does not lint source
# code comments: the file list in the `prose:lint` task decides that.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = wraithbox

# The style packages are vendored, not fetched: `mise run ci` stays
# offline, and an upstream change never arrives by auto-download. Only
# the rule files this config enables are committed, each package with
# its upstream license. Sources (pinned releases; sha256 of the zip):
#
#   write-good  v0.4.1  MIT           2960ef10861ddc7dc76292a4967eb3789bf05ca24f862042f6d15f53332887f0
#     https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip
#   proselint   v0.3.4  BSD-3-Clause  48b1fb481ba44f6505d44346b283f6cdc74efd234f913bbdb09bf34420fab81c
#     https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip
#   Google      v0.7.1  MIT           4b67fca1f2a88595b2a578ab98bbf3017a23af677b04f93e862843f3ea1a9a0b
#     https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip
#   ai-tells    v1.37.0 MIT           f8d1e981abbfbac1aa092d1623a1ac9bc935f0b15e8071e7a072915abddf0570
#     https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip
#
# One local change to the upstream files: every literal space in a rule
# pattern is rewritten to `\s`, so a phrase still matches where a
# paragraph wraps between its words (ai-training scripts/vale_linebreaks.py,
# which produced these files). To refresh: download the new zip, check
# its sha256, apply the same rewrite, copy over the enabled rules, update
# this table, and read the diff.

[*.{md,mdx}]
BasedOnStyles = Vale, House
# Spelling belongs to cspell (`mise run prose:spell`, American English),
# so Vale's built-in check is off. Vale.Terms stays: it enforces the
# casing of the names in the accept list.
Vale.Spelling = NO

# write-good. A doubled word ("the the") is a typo every time, so it gates.
write-good.Illusions = error
write-good.Cliches = YES
write-good.Weasel = YES
write-good.ThereIs = warning
write-good.TooWordy = YES

# proselint. A hit in this first group is a defect every time.
proselint.Annotations = error
proselint.Cursing = error
proselint.LGBTOffensive = error
proselint.Hyperbole = error
proselint.RASSyndrome = error
proselint.Oxymorons = error
proselint.Malapropisms = error
proselint.Nonwords = error
proselint.DateCase = error
proselint.DateMidnight = error
proselint.DateRedundancy = error
proselint.DateSpacing = error
# A hit deserves a look but may be deliberate.
proselint.GenderBias = warning
proselint.LGBTTerms = warning
proselint.DenizenLabels = warning
proselint.GroupTerms = warning
proselint.CorporateSpeak = warning
proselint.Airlinese = warning
proselint.Jargon = warning
proselint.Archaisms = warning
proselint.Skunked = warning
proselint.Hedging = warning
proselint.Apologizing = warning
proselint.Currency = warning

# Google. A hit in this first group is a defect every time: "3pm", slash
# dates, a spaced em dash, "he/she", "A.B.C.", a period ending a
# heading, "tl;dr".
Google.AMPM = error
Google.DateFormat = error
Google.EmDash = error
Google.Gender = error
Google.Periods = error
Google.HeadingPunctuation = error
Google.Slang = error
# Advisory house style: present tense over "will", contractions, the
# Oxford comma, sentence-case headings, "for example" over "e.g.", no "currently" or
# "latest" (they rot), no "(s)".
Google.Will = warning
Google.Contractions = warning
Google.OxfordComma = warning
Google.Headings = warning
Google.Latin = warning
Google.Timeless = warning
Google.Exclamation = warning
Google.OptionalPlurals = warning
# Logical quotation: punctuation that is not quoted goes outside the
# quotation marks, so a quoted command never seems to end in a comma.
House.Quotes = warning

# ai-tells (tbhb/vale-ai-tells). Agents write much of this repository;
# these rules catch the register that gives that away. Zero hits and
# nobody types the phrase by accident, so these gate.
ai-tells.EmDashUsage = error
ai-tells.DoubleHyphen = error
ai-tells.ClosingPleasantries = error
ai-tells.OpeningCliches = error
ai-tells.ConclusionMarkers = error
ai-tells.UnpackExplore = error
ai-tells.DespiteChallenges = error
ai-tells.RhetoricalSelfAnswer = error
ai-tells.AICompoundPhrases = error
ai-tells.PromotionalPuffery = error
ai-tells.UrgencyInflation = error
ai-tells.WrapUpHeadings = error
ai-tells.MarketingHeadings = error
ai-tells.AnnouncementHeadings = error
ai-tells.ListIntroductions = error
# A hit deserves a look but may be deliberate.
ai-tells.RestatementMarkers = warning
ai-tells.HollowAcknowledgment = warning
ai-tells.ResonateOveruse = warning
ai-tells.StrategyBuzzwords = warning
ai-tells.AIAdjectiveNounPairs = warning
ai-tells.AbsoluteAssertions = warning
ai-tells.VagueAttributions = warning
ai-tells.DefensiveHedges = warning
ai-tells.FalseBalance = warning
ai-tells.FalseExclusivity = warning
ai-tells.IncompleteComparison = warning
ai-tells.StrawmanContrast = warning
ai-tells.RedundantPrecaution = warning
ai-tells.StackedHedges = warning
ai-tells.NegatedPair = warning
ai-tells.UniversalObject = warning
ai-tells.OverusedVocabularyVerbs = warning
ai-tells.MicDropHeadings = warning
ai-tells.NarrativePivots = warning
ai-tells.SummativeAppositive = warning
ai-tells.RhetoricalDevices = warning
ai-tells.EmptyPaddingStacked = warning
ai-tells.NamedAdjective = warning
ai-tells.NominalizedScopeChange = warning
ai-tells.OrganicConsequence = warning
ai-tells.ParticipialPadding = warning
ai-tells.ScopePartition = warning
ai-tells.ServesAsDodge = warning
ai-tells.ShellNounCopula = warning
ai-tells.UnderRegime = warning
