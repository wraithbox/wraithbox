ai-tells.FigurativeSettles = warning
ai-tells.FigurativeStrikes = warning
ai-tells.FigurativeSweeps = warning
ai-tells.FigurativeTravels = warning
ai-tells.FigurativeTrips = warning
ai-tells.MotionMetaphors = warning
ai-tells.GrowthMetaphors = warning
ai-tells.JourneyMetaphors = warning
ai-tells.FusionMetaphors = warning
ai-tells.DepletionMetaphors = warning
ai-tells.EvasionMetaphors = warning
ai-tells.MortalityMetaphors = warning
ai-tells.AnthropomorphicJustification = warning
ai-tells.AnthropomorphicAdjectives = warning
ai-tells.ContrastiveNegation = warning
ai-tells.ContrastiveFormulas = warning
ai-tells.NegatedSubject = warning
ai-tells.NegatedObject = warning
ai-tells.UniversalSubject = warning
ai-tells.MicDrop = warning
ai-tells.StackedAnaphora = warning
ai-tells.ParallelStaccato = warning
ai-tells.CoordinatedReveal = warning
