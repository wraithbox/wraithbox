ai-tells.SycophancyMarkers = warning
ai-tells.ColloquialAssessments = warning
ai-tells.Metacommentary = warning
ai-tells.OverusedVocabulary = warning
ai-tells.SelfReference = warning
ai-tells.StructureAnnouncements = warning
# House copies of two ai-tells rules (see the comments in each file):
# Transitions fires only on a sentence-initial "Hence" or "Notably";
# VerbTricolon drops the tokens that matched plain noun lists.
House.Transitions = warning
House.VerbTricolon = warning
#
# Off, as in ai-training: the rules that flag ordinary technical
# vocabulary. AnthropomorphicCognition, ShipOveruse, BareNames,
# BareReaches, BareHolds, LabelAndExplain, FormalRegister ("implement"),
# HouseStyle, EnforcementMetaphors ("gate" is CI vocabulary),
# FigurativeDraws, FigurativeKeeps, ExplainerHeadings, AffirmativeFormulas,
# SequencingMarkers, VerbTricolonDensity, ColonUsage (the specs'
# "**Purpose:**" labels). Off from the other packages: write-good.Passive
# and write-good.So (too much idiom), Google.Passive, Google.Quotes (House.Quotes
# instead), Google.Acronyms, Google.Colons, Google.Spelling and
# proselint.Typography.
